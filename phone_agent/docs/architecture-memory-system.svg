<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Three-layer memory architecture</title>
  <desc id="desc">Detailed memory architecture showing vector memory, graph memory, session state, retrieval gateway triggers, clarification integration, context injection, and task lifecycle.</desc>
  <defs>
    <marker id="m-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="m-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#047857"/></marker>
    <marker id="m-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="m-red" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="m-orange" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ea580c"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #4b5563; }
      .section { fill: #fbfcfe; stroke: #cbd5e1; stroke-width: 1.2; }
      .section-title { font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: .5px; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.3; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #047857; }
      .purple { fill: #faf5ff; stroke: #7c3aed; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .small { font-size: 10.5px; fill: #475569; }
      .tiny { font-size: 9.5px; fill: #64748b; }
      .line { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .data { stroke: #2563eb; marker-end: url(#m-blue); }
      .graph { stroke: #047857; marker-end: url(#m-green); }
      .memory { stroke: #7c3aed; marker-end: url(#m-purple); stroke-dasharray: 6 4; }
      .risk { stroke: #dc2626; marker-end: url(#m-red); }
      .action { stroke: #ea580c; marker-end: url(#m-orange); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#fff"/>
  <text class="title" x="640" y="36" text-anchor="middle">Three-Layer Memory Architecture and Runtime Collaboration</text>
  <text class="subtitle" x="640" y="58" text-anchor="middle">Memory is not injected wholesale: stable knowledge is retrieved selectively, graph knowledge guides navigation, and session state stays lightweight.</text>

  <!-- Runtime and core -->
  <rect class="box blue" x="438" y="88" width="270" height="64" rx="10"/>
  <text class="name" x="573" y="114" text-anchor="middle">PhoneAgent</text>
  <text class="small" x="573" y="133" text-anchor="middle">main GUI control loop</text>
  <rect class="box orange" x="748" y="88" width="230" height="64" rx="10"/>
  <text class="name" x="863" y="114" text-anchor="middle">ClarificationAgent</text>
  <text class="small" x="863" y="133" text-anchor="middle">pre-task ambiguity resolution</text>
  <rect class="box red" x="1018" y="88" width="190" height="64" rx="10"/>
  <text class="name" x="1113" y="114" text-anchor="middle">Core Services</text>
  <text class="small" x="1113" y="133" text-anchor="middle">TaskSpec, Guard, Status</text>
  <path class="line data" d="M708 120 H744"/>
  <path class="line risk" d="M978 120 H1014"/>

  <!-- Three layers -->
  <rect class="section" x="40" y="198" width="370" height="344" rx="10"/>
  <text class="section-title" x="62" y="224">LAYER 1: VECTOR SEMANTIC MEMORY</text>
  <rect class="box purple" x="80" y="254" width="292" height="74" rx="9"/>
  <text class="name" x="226" y="280" text-anchor="middle">MemoryStore + FAISS</text>
  <text class="small" x="226" y="299" text-anchor="middle">2048-d embedding index for cross-session knowledge</text>
  <rect class="box" x="80" y="356" width="132" height="34" rx="6"/>
  <text class="small" x="146" y="377" text-anchor="middle">USER_PREFERENCE</text>
  <rect class="box" x="240" y="356" width="132" height="34" rx="6"/>
  <text class="small" x="306" y="377" text-anchor="middle">CONTACT</text>
  <rect class="box" x="80" y="404" width="132" height="34" rx="6"/>
  <text class="small" x="146" y="425" text-anchor="middle">TASK_PATTERN</text>
  <rect class="box" x="240" y="404" width="132" height="34" rx="6"/>
  <text class="small" x="306" y="425" text-anchor="middle">APP_USAGE</text>
  <rect class="box" x="80" y="452" width="132" height="34" rx="6"/>
  <text class="small" x="146" y="473" text-anchor="middle">CORRECTION</text>
  <rect class="box" x="240" y="452" width="132" height="34" rx="6"/>
  <text class="small" x="306" y="473" text-anchor="middle">BRAND_AFFINITY</text>
  <text class="tiny" x="226" y="516" text-anchor="middle">Used by ClarificationAgent to fill missing shopping slots before asking the user.</text>

  <rect class="section" x="455" y="198" width="370" height="344" rx="10"/>
  <text class="section-title" x="477" y="224">LAYER 2: GRAPH STRUCTURAL MEMORY</text>
  <rect class="box green" x="495" y="254" width="292" height="74" rx="9"/>
  <text class="name" x="641" y="280" text-anchor="middle">SpatialGraphMemory</text>
  <text class="small" x="641" y="299" text-anchor="middle">semantic navigation graph over page states</text>
  <rect class="box green" x="495" y="356" width="132" height="44" rx="7"/>
  <text class="small" x="561" y="382" text-anchor="middle">locate()</text>
  <rect class="box green" x="655" y="356" width="132" height="44" rx="7"/>
  <text class="small" x="721" y="382" text-anchor="middle">plan()</text>
  <rect class="box green" x="495" y="430" width="292" height="58" rx="8"/>
  <text class="name" x="641" y="454" text-anchor="middle">Gated Persistence</text>
  <text class="small" x="641" y="473" text-anchor="middle">record_observation(persist=false) -> flush on success</text>
  <text class="tiny" x="641" y="516" text-anchor="middle">Provides known paths for Navigate mode and postconditions for Verify mode.</text>

  <rect class="section" x="870" y="198" width="370" height="344" rx="10"/>
  <text class="section-title" x="892" y="224">LAYER 3: SESSION STATE</text>
  <rect class="box blue" x="910" y="254" width="292" height="74" rx="9"/>
  <text class="name" x="1056" y="280" text-anchor="middle">UnifiedSessionState</text>
  <text class="small" x="1056" y="299" text-anchor="middle">lightweight state for the current task</text>
  <rect class="box" x="910" y="356" width="132" height="34" rx="6"/>
  <text class="small" x="976" y="377" text-anchor="middle">step history</text>
  <rect class="box" x="1070" y="356" width="132" height="34" rx="6"/>
  <text class="small" x="1136" y="377" text-anchor="middle">visited products</text>
  <rect class="box" x="910" y="404" width="132" height="34" rx="6"/>
  <text class="small" x="976" y="425" text-anchor="middle">constraints</text>
  <rect class="box" x="1070" y="404" width="132" height="34" rx="6"/>
  <text class="small" x="1136" y="425" text-anchor="middle">stagnation</text>
  <rect class="box blue" x="910" y="468" width="292" height="34" rx="7"/>
  <text class="small" x="1056" y="489" text-anchor="middle">progress summary injected every step</text>
  <text class="tiny" x="1056" y="516" text-anchor="middle">Carries recent task context without loading full long-term memory.</text>

  <!-- Connections from runtime -->
  <path class="line memory" d="M520 152 C390 168 230 168 226 194"/>
  <path class="line graph" d="M573 152 C600 170 630 174 641 194"/>
  <path class="line data" d="M640 152 C800 172 1036 166 1056 194"/>
  <path class="line memory" d="M226 542 C250 604 770 610 862 152"/>
  <path class="line graph" d="M641 542 C640 612 582 650 574 156"/>
  <path class="line data" d="M1056 542 C1020 610 740 638 574 156"/>

  <!-- Retrieval gateway -->
  <rect class="section" x="40" y="586" width="1200" height="118" rx="10"/>
  <text class="section-title" x="62" y="612">RETRIEVALGATEWAY: SELECTIVE DEEP RETRIEVAL</text>
  <rect class="box orange" x="76" y="636" width="170" height="42" rx="7"/>
  <text class="small" x="161" y="653" text-anchor="middle">uncertainty</text>
  <text class="tiny" x="161" y="668" text-anchor="middle">"not sure", "forgot"</text>
  <rect class="box orange" x="284" y="636" width="170" height="42" rx="7"/>
  <text class="small" x="369" y="653" text-anchor="middle">comparison</text>
  <text class="tiny" x="369" y="668" text-anchor="middle">"which is cheaper"</text>
  <rect class="box orange" x="492" y="636" width="170" height="42" rx="7"/>
  <text class="small" x="577" y="653" text-anchor="middle">calculation</text>
  <text class="tiny" x="577" y="668" text-anchor="middle">"total price"</text>
  <rect class="box orange" x="700" y="636" width="170" height="42" rx="7"/>
  <text class="small" x="785" y="653" text-anchor="middle">recall</text>
  <text class="tiny" x="785" y="668" text-anchor="middle">"previous item"</text>
  <rect class="box orange" x="908" y="636" width="170" height="42" rx="7"/>
  <text class="small" x="993" y="653" text-anchor="middle">stagnation</text>
  <text class="tiny" x="993" y="668" text-anchor="middle">same action x3</text>
  <rect class="box green" x="1110" y="636" width="96" height="42" rx="7"/>
  <text class="small" x="1158" y="653" text-anchor="middle">inject</text>
  <text class="tiny" x="1158" y="668" text-anchor="middle">minimal context</text>
  <path class="line action" d="M1078 657 H1106"/>

  <!-- Injection and lifecycle -->
  <rect class="section" x="40" y="736" width="1200" height="126" rx="10"/>
  <text class="section-title" x="62" y="762">TASK LIFECYCLE AND VLM CONTEXT INJECTION</text>
  <rect class="box purple" x="80" y="788" width="246" height="46" rx="8"/>
  <text class="small" x="203" y="806" text-anchor="middle">task start: similar tasks + preferences</text>
  <text class="tiny" x="203" y="822" text-anchor="middle">MemoryManager.start_task()</text>
  <rect class="box orange" x="374" y="788" width="246" height="46" rx="8"/>
  <text class="small" x="497" y="806" text-anchor="middle">each step: progress + retrieval signals</text>
  <text class="tiny" x="497" y="822" text-anchor="middle">record_step(), get_injection_context()</text>
  <rect class="box red" x="668" y="788" width="246" height="46" rx="8"/>
  <text class="small" x="791" y="806" text-anchor="middle">risk page: SpecGuard hint</text>
  <text class="tiny" x="791" y="822" text-anchor="middle">expected color/storage/size</text>
  <rect class="box green" x="962" y="788" width="246" height="46" rx="8"/>
  <text class="small" x="1085" y="806" text-anchor="middle">task end: save memory + graph commit</text>
  <text class="tiny" x="1085" y="822" text-anchor="middle">end_task(), flush_staged_graph()</text>
  <path class="line memory" d="M326 811 H370"/>
  <path class="line data" d="M620 811 H664"/>
  <path class="line graph" d="M914 811 H958"/>
</svg>
