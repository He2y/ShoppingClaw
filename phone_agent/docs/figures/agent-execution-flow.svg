<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .phase-label { font-size: 13px; font-weight: 600; }
    .node-label { font-size: 12px; fill: #ffffff; font-weight: 500; }
    .node-label-dark { font-size: 12px; fill: #111827; font-weight: 500; }
    .node-sub { font-size: 10px; fill: #6b7280; }
    .node-sub-light { font-size: 10px; fill: rgba(255,255,255,0.8); }
    .legend-text { font-size: 11px; fill: #6b7280; }
    .badge { font-size: 10px; fill: #fff; font-weight: 600; }
  </style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" class="title">Agent Execution Loop: Dual-Speed Dispatch</text>
  <text x="600" y="54" text-anchor="middle" class="subtitle">Each step follows: Observe -> Classify -> Verify -> Localize -> Dispatch -> Execute -> Update</text>

  <!-- ====== Phase 1: Observe ====== -->
  <circle cx="72" cy="72" r="14" fill="#2563eb"/>
  <text x="72" y="76" text-anchor="middle" class="badge">1</text>

  <rect x="48" y="90" width="130" height="80" rx="10" fill="#2563eb" filter="url(#sh)"/>
  <text x="113" y="120" text-anchor="middle" class="node-label">Observe</text>
  <text x="113" y="136" text-anchor="middle" class="node-sub-light">Screenshot</text>
  <text x="113" y="150" text-anchor="middle" class="node-sub-light">+ Current App</text>

  <!-- ====== Phase 2: Classify ====== -->
  <circle cx="262" cy="72" r="14" fill="#0d9488"/>
  <text x="262" y="76" text-anchor="middle" class="badge">2</text>

  <rect x="218" y="90" width="150" height="80" rx="10" fill="#0d9488" filter="url(#sh)"/>
  <text x="293" y="120" text-anchor="middle" class="node-label">Page Semantics</text>
  <text x="293" y="136" text-anchor="middle" class="node-sub-light">PageClassifier</text>
  <text x="293" y="150" text-anchor="middle" class="node-sub-light">or RuntimeDAG hint</text>

  <!-- Arrow 1->2 -->
  <line x1="178" y1="130" x2="216" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- ====== Phase 3: Verification Gate (Diamond) ====== -->
  <circle cx="470" cy="72" r="14" fill="#dc2626"/>
  <text x="470" y="76" text-anchor="middle" class="badge">3</text>

  <polygon points="470,90 540,130 470,170 400,130" fill="#fff" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
  <text x="470" y="126" text-anchor="middle" class="node-label-dark" font-size="11">Verification</text>
  <text x="470" y="140" text-anchor="middle" class="node-label-dark" font-size="11">Gate</text>

  <!-- Arrow 2->3 -->
  <line x1="368" y1="130" x2="398" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- Take_over branch (down from diamond) -->
  <rect x="420" y="200" width="100" height="50" rx="8" fill="#dc2626" filter="url(#sh)"/>
  <text x="470" y="222" text-anchor="middle" class="node-label">Take_over</text>
  <text x="470" y="236" text-anchor="middle" class="node-sub-light">(human)</text>
  <line x1="470" y1="170" x2="470" y2="198" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-red)"/>
  <text x="490" y="188" font-size="10" fill="#dc2626">login/captcha</text>

  <!-- ====== Phase 4: Graph Localize + Plan ====== -->
  <circle cx="650" cy="72" r="14" fill="#16a34a"/>
  <text x="650" y="76" text-anchor="middle" class="badge">4</text>

  <rect x="590" y="90" width="180" height="80" rx="10" fill="#16a34a" filter="url(#sh)"/>
  <text x="680" y="116" text-anchor="middle" class="node-label">Graph Localize</text>
  <text x="680" y="132" text-anchor="middle" class="node-sub-light">Belief update + GoalSpec</text>
  <text x="680" y="148" text-anchor="middle" class="node-sub-light">Route planning</text>

  <!-- Arrow 3->4 -->
  <line x1="540" y1="130" x2="588" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="558" y="122" font-size="10" fill="#16a34a">clear</text>

  <!-- ====== Phase 5: Dispatch Gate (Diamond) ====== -->
  <circle cx="880" cy="72" r="14" fill="#ea580c"/>
  <text x="880" y="76" text-anchor="middle" class="badge">5</text>

  <polygon points="880,90 960,130 880,170 800,130" fill="#fff" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <text x="880" y="126" text-anchor="middle" class="node-label-dark" font-size="11">Dispatch</text>
  <text x="880" y="140" text-anchor="middle" class="node-label-dark" font-size="11">Gate</text>

  <!-- Arrow 4->5 -->
  <line x1="770" y1="130" x2="798" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- ====== Fast Path (upper branch) ====== -->
  <rect x="1000" y="70" width="160" height="55" rx="10" fill="#16a34a" filter="url(#sh)"/>
  <text x="1080" y="93" text-anchor="middle" class="node-label">Fast Path</text>
  <text x="1080" y="108" text-anchor="middle" class="node-sub-light">~0.5s, no VLM</text>

  <path d="M960,115 L980,97 L998,97" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <rect x="960" y="78" width="42" height="16" rx="3" fill="#fff"/>
  <text x="981" y="89" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="600">grounded</text>

  <!-- ====== Full VLM Path (lower branch) ====== -->
  <rect x="1000" y="155" width="160" height="55" rx="10" fill="#2563eb" filter="url(#sh)"/>
  <text x="1080" y="178" text-anchor="middle" class="node-label">Full VLM Path</text>
  <text x="1080" y="193" text-anchor="middle" class="node-sub-light">~5s, reasoning</text>

  <path d="M960,145 L980,163 L998,163" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="960" y="152" width="42" height="16" rx="3" fill="#fff"/>
  <text x="981" y="163" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="600">semantic</text>

  <!-- ====== Phase 6: Execute + Verify ====== -->
  <!-- Both paths merge into Execute -->
  <rect x="200" y="320" width="800" height="130" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="216" y="340" class="phase-label" fill="#111827">Phase 6: Execute, Verify, and Update</text>

  <!-- Sub-nodes inside Phase 6 -->
  <rect x="220" y="355" width="140" height="50" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.2" filter="url(#sh)"/>
  <text x="290" y="376" text-anchor="middle" class="node-label-dark">SpecGuard</text>
  <text x="290" y="390" text-anchor="middle" class="node-sub">purchase safety</text>

  <rect x="385" y="355" width="140" height="50" rx="8" fill="#fff" stroke="#fca5a5" stroke-width="1.2" filter="url(#sh)"/>
  <text x="455" y="376" text-anchor="middle" class="node-label-dark">Execute</text>
  <text x="455" y="390" text-anchor="middle" class="node-sub">device action</text>

  <rect x="550" y="355" width="155" height="50" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.2" filter="url(#sh)"/>
  <text x="627" y="376" text-anchor="middle" class="node-label-dark">Postcondition</text>
  <text x="627" y="390" text-anchor="middle" class="node-sub">verify page type</text>

  <rect x="730" y="355" width="155" height="50" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#sh)"/>
  <text x="807" y="376" text-anchor="middle" class="node-label-dark">Memory + Graph</text>
  <text x="807" y="390" text-anchor="middle" class="node-sub">record + stage</text>

  <!-- Arrows inside Phase 6 -->
  <line x1="360" y1="380" x2="383" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="525" y1="380" x2="548" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="705" y1="380" x2="728" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-gray)"/>

  <!-- Fast Path -> Phase 6 -->
  <path d="M1080,125 L1080,300 L600,300 L600,318" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Full VLM -> Phase 6 -->
  <path d="M1080,210 L1080,285 L650,285 L650,318" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- ====== Feedback loop back to Observe ====== -->
  <path d="M807,405 L807,470 C807,510 50,510 50,470 L50,172" stroke="#059669" stroke-width="2.2" fill="none" stroke-dasharray="8,4" marker-end="url(#a-green)"/>
  <rect x="340" y="478" width="120" height="22" rx="4" fill="#fff" stroke="#059669" stroke-width="1"/>
  <text x="400" y="493" text-anchor="middle" font-size="11" fill="#059669" font-weight="500">Next Step Loop</text>

  <!-- ====== Postcondition mismatch (dashed back to VLM) ====== -->
  <path d="M627,405 L627,430 C627,450 1150,450 1150,200 L1150,182 L1162,182" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <rect x="830" y="432" width="120" height="18" rx="3" fill="#fff" stroke="none"/>
  <text x="890" y="445" text-anchor="middle" font-size="9" fill="#dc2626">mismatch: fallback</text>

  <!-- ====== Graph Co-pilot annotation ====== -->
  <rect x="1000" y="116" width="160" height="38" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="1080" y="132" text-anchor="middle" font-size="10" fill="#ea580c">Graph Co-pilot</text>
  <text x="1080" y="144" text-anchor="middle" font-size="9" fill="#6b7280">~3s, hint + verify</text>

  <!-- ====== Clarification sub-step annotation ====== -->
  <rect x="580" y="185" width="200" height="55" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="680" y="203" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="500">Clarification (Step 1 only)</text>
  <text x="680" y="217" text-anchor="middle" font-size="9" fill="#6b7280">Layer 1: Rule -> Layer 2: Memory</text>
  <text x="680" y="229" text-anchor="middle" font-size="9" fill="#6b7280">-> Layer 3: Strong VLM</text>
  <line x1="680" y1="170" x2="680" y2="183" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-gray)"/>

  <!-- ====== Legend ====== -->
  <rect x="40" y="560" width="500" height="105" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="56" y="580" font-size="12" fill="#111827" font-weight="600">Execution Paths</text>

  <rect x="56" y="590" width="50" height="18" rx="4" fill="#16a34a"/>
  <text x="116" y="603" font-size="11" fill="#111827">Fast Path: grounded action, confidence >= 0.9, ~0.5s latency</text>

  <rect x="56" y="614" width="50" height="18" rx="4" fill="#ea580c" stroke="#ea580c" fill-opacity="0.15" stroke-dasharray="4,2"/>
  <text x="116" y="627" font-size="11" fill="#111827">Graph Co-pilot: graph hint + VLM verification, ~3s latency</text>

  <rect x="56" y="638" width="50" height="18" rx="4" fill="#2563eb"/>
  <text x="116" y="651" font-size="11" fill="#111827">Full VLM Path: semantic reasoning, content decisions, ~5s latency</text>
</svg>
