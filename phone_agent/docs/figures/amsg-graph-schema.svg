<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .section-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .node-label { font-size: 13px; font-weight: 600; }
    .field { font-size: 10.5px; fill: #374151; }
    .field-type { font-size: 10px; fill: #6b7280; font-style: italic; }
    .edge-label { font-size: 11px; font-weight: 600; }
    .legend-text { font-size: 11px; fill: #6b7280; }
    .badge { font-size: 10px; fill: #fff; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" class="title">AMSG Graph Schema and Navigation Model</text>
  <text x="600" y="54" text-anchor="middle" class="subtitle">UIState-Action-UIState motif with lifecycle evidence and outcome distributions</text>

  <!-- ============ SECTION A: Core Motif ============ -->
  <rect x="30" y="70" width="750" height="280" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="90" class="section-title">Core Persisted Motif</text>

  <!-- UIState (Source) -->
  <rect x="50" y="108" width="200" height="220" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <rect x="50" y="108" width="200" height="32" rx="10" fill="#7c3aed"/>
  <rect x="50" y="128" width="200" height="12" fill="#7c3aed"/>
  <circle cx="70" cy="124" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="70" y="128" text-anchor="middle" class="badge">1</text>
  <text x="160" y="128" text-anchor="middle" class="node-label" fill="#fff">UIState / PageState</text>
  <text x="160" y="148" text-anchor="middle" class="field-type">page abstraction</text>
  <line x1="60" y1="158" x2="240" y2="158" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="66" y="174" class="field">state_id</text>
  <text x="66" y="190" class="field">app</text>
  <text x="66" y="206" class="field">page_type</text>
  <text x="66" y="222" class="field">landmarks[ ]</text>
  <text x="66" y="238" class="field">affordances[ ]</text>
  <text x="66" y="254" class="field">slots{ }</text>
  <text x="66" y="270" class="field">risk_level</text>
  <text x="66" y="286" class="field">semantic_signature</text>
  <text x="66" y="302" class="field">screenshot_hash</text>
  <text x="180" y="174" class="field-type" text-anchor="end">string</text>
  <text x="180" y="190" class="field-type" text-anchor="end">string</text>
  <text x="180" y="206" class="field-type" text-anchor="end">enum</text>
  <text x="180" y="222" class="field-type" text-anchor="end">tuple</text>
  <text x="180" y="238" class="field-type" text-anchor="end">tuple</text>
  <text x="180" y="254" class="field-type" text-anchor="end">dict</text>
  <text x="180" y="270" class="field-type" text-anchor="end">enum</text>
  <text x="180" y="286" class="field-type" text-anchor="end">hash</text>
  <text x="180" y="302" class="field-type" text-anchor="end">MD5</text>

  <!-- Action Node -->
  <rect x="320" y="108" width="200" height="220" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <rect x="320" y="108" width="200" height="32" rx="10" fill="#ea580c"/>
  <rect x="320" y="128" width="200" height="12" fill="#ea580c"/>
  <circle cx="340" cy="124" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="340" y="128" text-anchor="middle" class="badge">2</text>
  <text x="430" y="128" text-anchor="middle" class="node-label" fill="#fff">Action</text>
  <text x="430" y="148" text-anchor="middle" class="field-type">semantic affordance</text>
  <line x1="330" y1="158" x2="510" y2="158" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="336" y="174" class="field">type</text>
  <text x="336" y="190" class="field">intent</text>
  <text x="336" y="206" class="field">semantic_target</text>
  <text x="336" y="222" class="field">target_locator</text>
  <text x="336" y="238" class="field">expected_postcondition</text>
  <text x="336" y="254" class="field">confidence</text>
  <text x="336" y="270" class="field">lifecycle_stage</text>
  <text x="336" y="286" class="field">outcome_entropy</text>
  <text x="336" y="302" class="field">risk_level</text>
  <text x="456" y="174" class="field-type" text-anchor="end">enum</text>
  <text x="456" y="190" class="field-type" text-anchor="end">string</text>
  <text x="456" y="206" class="field-type" text-anchor="end">string</text>
  <text x="456" y="222" class="field-type" text-anchor="end">dict</text>
  <text x="456" y="238" class="field-type" text-anchor="end">page_type</text>
  <text x="456" y="254" class="field-type" text-anchor="end">float</text>
  <text x="456" y="270" class="field-type" text-anchor="end">enum</text>
  <text x="456" y="286" class="field-type" text-anchor="end">float</text>
  <text x="456" y="302" class="field-type" text-anchor="end">enum</text>

  <!-- Target UIState -->
  <rect x="590" y="108" width="175" height="145" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <rect x="590" y="108" width="175" height="32" rx="10" fill="#7c3aed"/>
  <rect x="590" y="128" width="175" height="12" fill="#7c3aed"/>
  <circle cx="610" cy="124" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="610" y="128" text-anchor="middle" class="badge">3</text>
  <text x="687" y="128" text-anchor="middle" class="node-label" fill="#fff">Target UIState</text>
  <text x="687" y="148" text-anchor="middle" class="field-type">learned postcondition</text>
  <line x1="600" y1="158" x2="755" y2="158" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="606" y="176" class="field">Learned from the</text>
  <text x="606" y="192" class="field">next observation,</text>
  <text x="606" y="208" class="field">not raw replay.</text>
  <text x="606" y="230" class="field" fill="#7c3aed">Same schema as</text>
  <text x="606" y="246" class="field" fill="#7c3aed">UIState node 1.</text>

  <!-- NEXT_ACTION edge -->
  <line x1="250" y1="200" x2="318" y2="200" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-o)"/>
  <rect x="254" y="185" width="60" height="16" rx="3" fill="#fff"/>
  <text x="284" y="196" text-anchor="middle" class="edge-label" fill="#ea580c" font-size="10">NEXT_ACTION</text>

  <!-- PRODUCES edge -->
  <line x1="520" y1="200" x2="588" y2="200" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-p)"/>
  <rect x="524" y="185" width="58" height="16" rx="3" fill="#fff"/>
  <text x="553" y="196" text-anchor="middle" class="edge-label" fill="#7c3aed" font-size="10">PRODUCES</text>

  <!-- ============ SECTION B: TaskTarget ============ -->
  <rect x="800" y="70" width="375" height="165" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="816" y="90" class="section-title">Trajectory Anchors</text>

  <rect x="820" y="108" width="170" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <rect x="820" y="108" width="170" height="28" rx="10" fill="#2563eb"/>
  <rect x="820" y="128" width="170" height="8" fill="#2563eb"/>
  <circle cx="840" cy="122" r="10" fill="rgba(255,255,255,0.25)"/>
  <text x="840" y="126" text-anchor="middle" class="badge" font-size="9">4</text>
  <text x="915" y="126" text-anchor="middle" class="node-label" fill="#fff" font-size="12">TaskTarget</text>
  <text x="836" y="152" class="field">target_id</text>
  <text x="836" y="168" class="field">description</text>
  <text x="836" y="184" class="field">task_type</text>
  <text x="836" y="200" class="field">success</text>

  <!-- TaskTarget edges to UIState -->
  <text x="1010" y="146" class="field" fill="#2563eb">STARTS_AT -></text>
  <text x="1010" y="162" class="field" fill="#2563eb">ENDS_AT   -></text>
  <rect x="1100" y="130" width="60" height="40" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1130" y="155" text-anchor="middle" font-size="10" fill="#7c3aed">UIState</text>

  <!-- ============ SECTION C: Lifecycle ============ -->
  <rect x="30" y="370" width="550" height="190" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="390" class="section-title">Edge Lifecycle State Machine</text>
  <text x="260" y="390" class="subtitle">(Definition 7-8)</text>

  <!-- States -->
  <rect x="60" y="410" width="100" height="36" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="110" y="433" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="500">hypothesis</text>

  <rect x="210" y="410" width="100" height="36" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="433" text-anchor="middle" font-size="11" fill="#166534" font-weight="500">candidate</text>

  <rect x="360" y="410" width="100" height="36" rx="8" fill="#16a34a" stroke="none"/>
  <text x="410" y="433" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">promoted</text>

  <rect x="360" y="470" width="100" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="410" y="493" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="500">demoted</text>

  <!-- Lifecycle arrows -->
  <line x1="160" y1="428" x2="208" y2="428" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="184" y="420" text-anchor="middle" font-size="9" fill="#6b7280">verified</text>

  <line x1="310" y1="428" x2="358" y2="428" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="334" y="420" text-anchor="middle" font-size="9" fill="#6b7280">dominant</text>

  <line x1="410" y1="446" x2="410" y2="468" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="445" y="462" font-size="9" fill="#6b7280">UI change</text>

  <path d="M360,488 C300,488 200,470 200,450 L200,448 L130,448 L130,448 L120,448" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-dasharray="4,2"/>
  <text x="240" y="504" font-size="9" fill="#6b7280">re-explore</text>

  <!-- Promotion criteria -->
  <rect x="60" y="516" width="500" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="75" y="535" font-size="10" fill="#166534" font-weight="500">Promotion: verification_count >= min  AND  dominance_ratio >= threshold  AND  risk != high</text>

  <!-- ============ SECTION D: Outcome Distribution ============ -->
  <rect x="600" y="370" width="575" height="190" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="616" y="390" class="section-title">Outcome Distribution per (source, action_key)</text>
  <text x="930" y="390" class="subtitle">(Definition 9)</text>

  <!-- Bar chart visualization -->
  <g transform="translate(630, 405)">
    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="#d1d5db" stroke-width="1"/>
    <!-- X axis -->
    <line x1="0" y1="120" x2="280" y2="120" stroke="#d1d5db" stroke-width="1"/>

    <!-- Bars -->
    <rect x="15" y="15" width="40" height="105" rx="3" fill="#16a34a" opacity="0.85"/>
    <text x="35" y="135" text-anchor="middle" font-size="9" fill="#6b7280">spec_sel.</text>
    <text x="35" y="10" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="600">73%</text>

    <rect x="75" y="75" width="40" height="45" rx="3" fill="#eab308" opacity="0.85"/>
    <text x="95" y="135" text-anchor="middle" font-size="9" fill="#6b7280">login</text>
    <text x="95" y="70" text-anchor="middle" font-size="9" fill="#eab308" font-weight="600">18%</text>

    <rect x="135" y="100" width="40" height="20" rx="3" fill="#dc2626" opacity="0.85"/>
    <text x="155" y="135" text-anchor="middle" font-size="9" fill="#6b7280">popup</text>
    <text x="155" y="95" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">9%</text>

    <rect x="195" y="110" width="40" height="10" rx="3" fill="#6b7280" opacity="0.5"/>
    <text x="215" y="135" text-anchor="middle" font-size="9" fill="#6b7280">other</text>

    <!-- Axis labels -->
    <text x="140" y="155" text-anchor="middle" font-size="10" fill="#6b7280">Target page type</text>
    <text x="-8" y="65" text-anchor="middle" font-size="10" fill="#6b7280" transform="rotate(-90, -8, 65)">Freq</text>
  </g>

  <!-- Entropy formula and explanation -->
  <rect x="940" y="405" width="220" height="140" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="955" y="425" font-size="11" fill="#111827" font-weight="600">Shannon Entropy</text>
  <text x="955" y="445" font-size="12" fill="#374151" font-style="italic">H = -Sigma p_i * ln(p_i)</text>
  <line x1="950" y1="455" x2="1150" y2="455" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="955" y="475" font-size="10" fill="#374151">Low H (&lt; 0.3): deterministic</text>
  <rect x="1110" y="465" width="40" height="14" rx="3" fill="#dcfce7"/>
  <text x="1130" y="476" text-anchor="middle" font-size="9" fill="#16a34a">safe</text>

  <text x="955" y="495" font-size="10" fill="#374151">Med H (0.3-0.8): verify</text>
  <rect x="1110" y="485" width="40" height="14" rx="3" fill="#fef9c3"/>
  <text x="1130" y="496" text-anchor="middle" font-size="9" fill="#a16207">VLM</text>

  <text x="955" y="515" font-size="10" fill="#374151">High H (&gt; 0.8): uncertain</text>
  <rect x="1110" y="505" width="40" height="14" rx="3" fill="#fee2e2"/>
  <text x="1130" y="516" text-anchor="middle" font-size="9" fill="#dc2626">block</text>

  <text x="955" y="535" font-size="10" fill="#7c3aed" font-weight="500">Data-driven VLM boundary</text>

  <!-- ============ SECTION E: Runtime Navigation ============ -->
  <rect x="30" y="580" width="1145" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="600" class="section-title" fill="#2563eb">Runtime Navigation Pipeline</text>

  <rect x="60" y="615" width="145" height="40" rx="8" fill="#7c3aed" filter="url(#sh)"/>
  <text x="132" y="640" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Belief Localization</text>

  <rect x="260" y="615" width="145" height="40" rx="8" fill="#16a34a" filter="url(#sh)"/>
  <text x="332" y="640" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Route Planning</text>

  <rect x="460" y="615" width="145" height="40" rx="8" fill="#ea580c" filter="url(#sh)"/>
  <text x="532" y="640" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Action Advisor</text>

  <rect x="660" y="615" width="145" height="40" rx="8" fill="#2563eb" filter="url(#sh)"/>
  <text x="732" y="640" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Dispatch Gate</text>

  <rect x="860" y="615" width="145" height="40" rx="8" fill="#059669" filter="url(#sh)"/>
  <text x="932" y="636" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Fast Path</text>
  <text x="932" y="648" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">or Full VLM</text>

  <!-- Runtime nav arrows -->
  <line x1="205" y1="635" x2="258" y2="635" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="231" y="626" text-anchor="middle" font-size="9" fill="#6b7280">belief</text>
  <line x1="405" y1="635" x2="458" y2="635" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="431" y="626" text-anchor="middle" font-size="9" fill="#6b7280">route</text>
  <line x1="605" y1="635" x2="658" y2="635" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="631" y="626" text-anchor="middle" font-size="9" fill="#6b7280">hints</text>
  <line x1="805" y1="635" x2="858" y2="635" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="831" y="626" text-anchor="middle" font-size="9" fill="#6b7280">action</text>

  <!-- ====== Legend ====== -->
  <rect x="30" y="690" width="450" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="46" y="710" font-size="12" fill="#111827" font-weight="600">Edge Semantics</text>
  <line x1="46" y1="726" x2="76" y2="726" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-o)"/>
  <text x="82" y="730" class="legend-text">NEXT_ACTION (state -> action)</text>
  <line x1="260" y1="726" x2="290" y2="726" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-p)"/>
  <text x="296" y="730" class="legend-text">PRODUCES (action -> state)</text>
  <line x1="46" y1="746" x2="76" y2="746" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="82" y="750" class="legend-text">STARTS_AT / ENDS_AT (task anchors)</text>
</svg>
