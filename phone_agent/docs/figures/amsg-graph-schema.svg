<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">AMSG graph schema</title>
  <desc id="desc">Academic diagram of the ClawGUI-Agent Active Mobile Spatial Graph schema.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#243447"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1b2634; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #102033; }
      .node-text { font: 400 15px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #243447; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 700 14px Arial, sans-serif; fill: #243447; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .state { fill: #eef6ff; stroke: #2b6cb0; stroke-width: 2.5; }
      .action { fill: #effaf6; stroke: #0f766e; stroke-width: 2.5; }
      .func { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .task { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2.5; }
      .meta { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="840" fill="#ffffff"/>
  <text x="60" y="58" class="title">Active Mobile Spatial Graph (AMSG) Schema</text>
  <text x="60" y="86" class="subtitle">Typed graph used by ClawGUI-Agent for page localization, route planning, action reuse, and graph self-evolution.</text>

  <rect x="48" y="116" width="1304" height="680" rx="18" class="panel"/>

  <rect x="95" y="220" width="285" height="154" rx="14" class="state"/>
  <text x="125" y="258" class="node-title">UIState</text>
  <text x="125" y="292" class="node-text">app, page_type, risk_level</text>
  <text x="125" y="318" class="node-text">landmarks, affordances</text>
  <text x="125" y="344" class="node-text">slots, semantic_signature</text>

  <rect x="500" y="220" width="285" height="154" rx="14" class="action"/>
  <text x="530" y="258" class="node-title">Action</text>
  <text x="530" y="292" class="node-text">type, intent, semantic_target</text>
  <text x="530" y="318" class="node-text">target_locator, region</text>
  <text x="530" y="344" class="node-text">confidence, expected_postcondition</text>

  <rect x="905" y="220" width="285" height="154" rx="14" class="state"/>
  <text x="935" y="258" class="node-title">UIState</text>
  <text x="935" y="292" class="node-text">target page abstraction</text>
  <text x="935" y="318" class="node-text">postcondition evidence</text>
  <text x="935" y="344" class="node-text">merged canonical state</text>

  <path d="M380 297 L500 297" class="edge"/>
  <text x="404" y="278" class="edge-label">NEXT_ACTION</text>
  <path d="M785 297 L905 297" class="edge"/>
  <text x="815" y="278" class="edge-label">PRODUCES</text>

  <rect x="480" y="438" width="325" height="136" rx="14" class="func"/>
  <text x="510" y="476" class="node-title">FunctionalityItem</text>
  <text x="510" y="510" class="node-text">canonical_role, type</text>
  <text x="510" y="536" class="node-text">visual/text evidence, bbox</text>
  <text x="510" y="562" class="node-text">observed_postcondition</text>

  <rect x="895" y="438" width="325" height="136" rx="14" class="func"/>
  <text x="925" y="476" class="node-title">FunctionalityCluster</text>
  <text x="925" y="510" class="node-text">canonical_name</text>
  <text x="925" y="536" class="node-text">member_functionality_ids</text>
  <text x="925" y="562" class="node-text">success_count, novelty_score</text>

  <path d="M238 374 C260 480 366 506 480 506" class="edge-soft"/>
  <text x="290" y="480" class="edge-label">EXPOSES_FUNCTION</text>
  <path d="M805 506 L895 506" class="edge"/>
  <text x="815" y="488" class="edge-label">MEMBER_OF</text>
  <path d="M645 374 L645 438" class="edge"/>
  <text x="660" y="414" class="edge-label">IMPLEMENTS_FUNCTION</text>
  <path d="M1058 438 C1070 396 1048 380 1048 374" class="edge-soft"/>
  <text x="1085" y="415" class="edge-label">LEADS_TO</text>

  <rect x="96" y="610" width="328" height="118" rx="14" class="task"/>
  <text x="126" y="648" class="node-title">TaskTarget</text>
  <text x="126" y="682" class="node-text">task description, goal_spec</text>
  <text x="126" y="708" class="node-text">trajectory retrieval surface</text>
  <path d="M222 610 C210 500 205 430 228 374" class="edge-soft"/>
  <text x="78" y="498" class="edge-label">STARTS_AT</text>
  <path d="M424 670 C710 720 1000 665 1048 374" class="edge-soft"/>
  <text x="1024" y="650" class="edge-label">ENDS_AT</text>

  <rect x="558" y="628" width="368" height="96" rx="14" class="meta"/>
  <text x="588" y="665" class="node-title">Lifecycle Metadata</text>
  <text x="588" y="699" class="node-text">hypothesis -> candidate -> promoted -> demoted</text>

  <path d="M642 374 C642 430 710 510 746 628" class="edge-soft"/>
  <text x="706" y="608" class="edge-label">verification_count / entropy</text>

  <rect x="984" y="628" width="250" height="96" rx="14" class="meta"/>
  <text x="1014" y="665" class="node-title">Schema Prior</text>
  <text x="1014" y="699" class="node-text">page types, aliases, risk</text>
</svg>
