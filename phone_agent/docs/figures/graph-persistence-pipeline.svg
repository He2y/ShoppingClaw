<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">AMSG automatic persistence pipeline</title>
  <desc id="desc">Academic diagram of the ClawGUI-Agent graph automatic persistence pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #102033; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .lane-title { font: 700 17px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .online { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.2; }
      .offline { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; }
      .stage { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; }
      .quality { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; }
      .store { fill: #f8fafc; stroke: #475569; stroke-width: 2.2; }
      .lane { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1500" height="860" fill="#fff"/>
  <text x="54" y="58" class="title">Graph Automatic Persistence Pipeline</text>
  <text x="54" y="86" class="subtitle">Successful execution traces and exploration artifacts are staged, verified, canonicalized, and persisted into the AMSG v4 Neo4j graph.</text>

  <rect x="48" y="120" width="1390" height="214" rx="16" class="lane"/>
  <text x="66" y="151" class="lane-title">Online task execution</text>
  <rect x="88" y="184" width="210" height="92" rx="14" class="online"/>
  <text x="112" y="219" class="box-title">Runtime Step</text>
  <text x="112" y="249" class="box-text">screenshot + action</text>
  <rect x="370" y="184" width="230" height="92" rx="14" class="online"/>
  <text x="394" y="219" class="box-title">Pending Transition</text>
  <text x="394" y="249" class="box-text">source, action, expected page</text>
  <rect x="672" y="184" width="230" height="92" rx="14" class="online"/>
  <text x="696" y="219" class="box-title">Postcondition</text>
  <text x="696" y="249" class="box-text">next page verifies outcome</text>
  <rect x="972" y="184" width="260" height="92" rx="14" class="stage"/>
  <text x="996" y="219" class="box-title">Staged Graph</text>
  <text x="996" y="249" class="box-text">local PageState + TransitionEdge</text>
  <path d="M298 230 L370 230" class="edge"/>
  <path d="M600 230 L672 230" class="edge"/>
  <path d="M902 230 L972 230" class="edge"/>

  <rect x="48" y="374" width="1390" height="162" rx="16" class="lane"/>
  <text x="66" y="405" class="lane-title">Offline and review inputs</text>
  <rect x="88" y="438" width="230" height="72" rx="14" class="offline"/>
  <text x="112" y="466" class="box-title">Exploration Files</text>
  <text x="112" y="492" class="box-text">pages, transitions, trajectory</text>
  <rect x="400" y="438" width="230" height="72" rx="14" class="offline"/>
  <text x="424" y="466" class="box-title">Trajectory Store</text>
  <text x="424" y="492" class="box-text">per-task JSON record</text>
  <rect x="710" y="438" width="240" height="72" rx="14" class="quality"/>
  <text x="734" y="466" class="box-title">TrajectoryReviewer</text>
  <text x="734" y="492" class="box-text">strong VLM quality gate</text>
  <rect x="1030" y="438" width="240" height="72" rx="14" class="stage"/>
  <text x="1054" y="466" class="box-title">Approved Candidates</text>
  <text x="1054" y="492" class="box-text">new validated transitions</text>
  <path d="M318 474 L400 474" class="soft"/>
  <path d="M630 474 L710 474" class="edge"/>
  <path d="M950 474 L1030 474" class="edge"/>

  <rect x="48" y="574" width="1390" height="246" rx="16" class="lane"/>
  <text x="66" y="605" class="lane-title">Canonicalization and persistence</text>
  <rect x="116" y="654" width="244" height="96" rx="14" class="stage"/>
  <text x="140" y="690" class="box-title">Canonicalize</text>
  <text x="140" y="718" class="box-text">merge by app, page_type, risk</text>
  <rect x="440" y="654" width="244" height="96" rx="14" class="stage"/>
  <text x="464" y="690" class="box-title">Quality Filter</text>
  <text x="464" y="718" class="box-text">risk, confidence, app consistency</text>
  <rect x="764" y="654" width="244" height="96" rx="14" class="quality"/>
  <text x="788" y="690" class="box-title">Lifecycle Flush</text>
  <text x="788" y="718" class="box-text">dominance, entropy, demotion</text>
  <rect x="1088" y="654" width="244" height="96" rx="14" class="store"/>
  <text x="1112" y="690" class="box-title">Neo4j AMSG v4</text>
  <text x="1112" y="718" class="box-text">UIState, Action, Functionality</text>
  <path d="M360 702 L440 702" class="edge"/>
  <path d="M684 702 L764 702" class="edge"/>
  <path d="M1008 702 L1088 702" class="edge"/>

  <path d="M1102 276 C1118 372 1118 560 238 654" class="edge"/>
  <path d="M1150 510 C1180 580 1208 612 1210 654" class="edge"/>
  <path d="M1232 654 C1290 558 1290 410 1232 276" class="soft"/>
  <text x="1262" y="560" class="box-text">runtime reload</text>
</svg>
