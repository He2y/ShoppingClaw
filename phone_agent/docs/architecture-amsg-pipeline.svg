<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">AMSG 空间图谱建图管线 (5-Stage Pipeline)</text>
  <text x="600" y="55" text-anchor="middle" fill="#6b7280" font-size="12">Active Mobile Spatial Graph — 从截图到可导航知识图谱</text>

  <!-- ═══ Input ═══ -->
  <rect x="30" y="90" width="130" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="118" text-anchor="middle" fill="#111827" font-size="14">📱</text>
  <text x="95" y="136" text-anchor="middle" fill="#111827" font-size="12" font-weight="600">截图</text>
  <text x="95" y="152" text-anchor="middle" fill="#6b7280" font-size="10">base64 image</text>

  <!-- Arrow to Stage 1 -->
  <line x1="160" y1="130" x2="196" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ═══ Stage 1: Page Classification ═══ -->
  <rect x="200" y="80" width="200" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="200" y="80" width="200" height="28" rx="10" fill="#2563eb" stroke="none"/>
  <rect x="200" y="98" width="200" height="10" fill="#2563eb" stroke="none"/>
  <text x="215" y="100" fill="#ffffff" font-size="11" font-weight="700">Stage 1</text>
  <text x="300" y="126" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">页面分类</text>
  <text x="300" y="144" text-anchor="middle" fill="#3b82f6" font-size="10">PageClassifier (VLM)</text>
  <text x="300" y="160" text-anchor="middle" fill="#6b7280" font-size="10">裁状态栏/导航栏</text>
  <text x="300" y="174" text-anchor="middle" fill="#6b7280" font-size="10">→ 17种 page_type</text>

  <!-- Arrow Stage 1 → 2 -->
  <line x1="400" y1="130" x2="430" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Data label -->
  <rect x="397" y="108" width="36" height="14" rx="2" fill="#dbeafe" stroke="none"/>
  <text x="415" y="119" text-anchor="middle" fill="#2563eb" font-size="8" font-weight="600">type</text>

  <!-- ═══ Stage 2: Semantic Extraction ═══ -->
  <rect x="434" y="80" width="200" height="108" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <rect x="434" y="80" width="200" height="28" rx="10" fill="#9333ea" stroke="none"/>
  <rect x="434" y="98" width="200" height="10" fill="#9333ea" stroke="none"/>
  <text x="449" y="100" fill="#ffffff" font-size="11" font-weight="700">Stage 2</text>
  <text x="534" y="126" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">语义提取</text>
  <text x="534" y="144" text-anchor="middle" fill="#7c3aed" font-size="10">ScreenSemanticsExtractor</text>
  <text x="534" y="160" text-anchor="middle" fill="#6b7280" font-size="10">landmarks / affordances</text>
  <text x="534" y="174" text-anchor="middle" fill="#6b7280" font-size="10">slots / risk_level</text>

  <!-- Arrow Stage 2 → 3 -->
  <line x1="634" y1="130" x2="664" y2="130" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="630" y="108" width="38" height="14" rx="2" fill="#ede9fe" stroke="none"/>
  <text x="649" y="119" text-anchor="middle" fill="#9333ea" font-size="8" font-weight="600">node</text>

  <!-- ═══ Stage 3: Dedup & Store ═══ -->
  <rect x="668" y="80" width="200" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="668" y="80" width="200" height="28" rx="10" fill="#16a34a" stroke="none"/>
  <rect x="668" y="98" width="200" height="10" fill="#16a34a" stroke="none"/>
  <text x="683" y="100" fill="#ffffff" font-size="11" font-weight="700">Stage 3</text>
  <text x="768" y="126" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">节点去重 &amp; 存储</text>
  <text x="768" y="144" text-anchor="middle" fill="#15803d" font-size="10">canonicalize_pages()</text>
  <text x="768" y="160" text-anchor="middle" fill="#6b7280" font-size="10">合并 landmarks/affordances</text>
  <text x="768" y="174" text-anchor="middle" fill="#6b7280" font-size="10">→ Neo4j :UIState</text>

  <!-- Arrow Stage 3 → 4 -->
  <line x1="868" y1="130" x2="898" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- ═══ Stage 4: Edge Building ═══ -->
  <rect x="902" y="80" width="268" height="108" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="902" y="80" width="268" height="28" rx="10" fill="#ea580c" stroke="none"/>
  <rect x="902" y="98" width="268" height="10" fill="#ea580c" stroke="none"/>
  <text x="917" y="100" fill="#ffffff" font-size="11" font-weight="700">Stage 4</text>
  <text x="1036" y="126" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">边构建 &amp; 转换记录</text>
  <text x="1036" y="144" text-anchor="middle" fill="#c2410c" font-size="10">TransitionEdge.from_action()</text>
  <text x="1036" y="160" text-anchor="middle" fill="#6b7280" font-size="10">语义边键去重 / 复合动作合成</text>
  <text x="1036" y="174" text-anchor="middle" fill="#6b7280" font-size="10">→ Neo4j :Action + NEXT_ACTION</text>

  <!-- Arrow Stage 4 → 5 -->
  <path d="M 1036,188 L 1036,220 L 600,220 L 600,250" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- ═══ Stage 5: Functionality Discovery ═══ -->
  <rect x="400" y="256" width="400" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="256" width="400" height="28" rx="10" fill="#dc2626" stroke="none"/>
  <rect x="400" y="274" width="400" height="10" fill="#dc2626" stroke="none"/>
  <text x="415" y="276" fill="#ffffff" font-size="11" font-weight="700">Stage 5 (v4 新增)</text>
  <text x="600" y="302" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">功能发现 &amp; 聚类</text>
  <text x="600" y="320" text-anchor="middle" fill="#b91c1c" font-size="10">FunctionalityExtractor → FunctionalityClusterer (threshold=0.58)</text>
  <text x="600" y="336" text-anchor="middle" fill="#6b7280" font-size="10">→ Neo4j :FunctionalityItem + :FunctionalityCluster + CoverageMetrics</text>

  <!-- ═══ Output: Neo4j Graph ═══ -->
  <line x1="600" y1="346" x2="600" y2="380" stroke="#111827" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Neo4j Schema Diagram -->
  <rect x="100" y="385" width="1000" height="280" rx="12" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="120" y="406" fill="#1e40af" font-size="12" font-weight="700">Neo4j Graph Schema (Output)</text>

  <!-- UIState node -->
  <rect x="140" y="420" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="448" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">:UIState</text>
  <text x="230" y="466" text-anchor="middle" fill="#3b82f6" font-size="10">page_type, landmarks</text>
  <text x="230" y="480" text-anchor="middle" fill="#3b82f6" font-size="10">affordances, slots, risk</text>

  <!-- Action node -->
  <rect x="510" y="420" width="180" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="448" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="700">:Action</text>
  <text x="600" y="466" text-anchor="middle" fill="#7c3aed" font-size="10">intent, semantic_target</text>
  <text x="600" y="480" text-anchor="middle" fill="#7c3aed" font-size="10">region, confidence, risk</text>

  <!-- Target UIState node -->
  <rect x="880" y="420" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="448" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">:UIState</text>
  <text x="970" y="466" text-anchor="middle" fill="#3b82f6" font-size="10">(target page)</text>

  <!-- NEXT_ACTION edge -->
  <line x1="320" y1="460" x2="506" y2="460" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="356" y="442" width="100" height="16" rx="3" fill="#ffffff" stroke="none"/>
  <text x="406" y="454" text-anchor="middle" fill="#ea580c" font-size="10" font-weight="600">:NEXT_ACTION</text>
  <text x="406" y="436" text-anchor="middle" fill="#9a3412" font-size="8">confidence, frequency</text>

  <!-- PRODUCES edge -->
  <line x1="690" y1="460" x2="876" y2="460" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="726" y="442" width="90" height="16" rx="3" fill="#ffffff" stroke="none"/>
  <text x="771" y="454" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="600">:PRODUCES</text>
  <text x="771" y="436" text-anchor="middle" fill="#166534" font-size="8">success_rate</text>

  <!-- TaskTarget node -->
  <rect x="140" y="530" width="180" height="60" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="230" y="556" text-anchor="middle" fill="#c2410c" font-size="13" font-weight="700">:TaskTarget</text>
  <text x="230" y="572" text-anchor="middle" fill="#9a3412" font-size="10">task description, success</text>

  <!-- STARTS_AT / ENDS_AT -->
  <path d="M 230,530 L 230,510 L 230,500" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="246" y="516" fill="#9333ea" font-size="9">:STARTS_AT</text>

  <path d="M 320,560 Q 600,560 970,500" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="600" y="550" text-anchor="middle" fill="#9333ea" font-size="9">:ENDS_AT</text>

  <!-- FunctionalityItem node -->
  <rect x="510" y="530" width="180" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="556" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">:FunctionalityItem</text>
  <text x="600" y="572" text-anchor="middle" fill="#b91c1c" font-size="10">canonical_role, bbox, region</text>

  <!-- EXPOSES_FUNCTION -->
  <path d="M 320,490 Q 370,530 510,560" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="380" y="526" fill="#dc2626" font-size="9">:EXPOSES</text>

  <!-- FunctionalityCluster -->
  <rect x="780" y="530" width="200" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="880" y="556" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">:FunctionalityCluster</text>
  <text x="880" y="572" text-anchor="middle" fill="#b91c1c" font-size="10">canonical_name, members</text>

  <!-- Cluster → UIState -->
  <path d="M 880,530 Q 940,510 970,500" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="946" y="516" fill="#2563eb" font-size="9">:LEADS_TO</text>

  <!-- ═══ Legend ═══ -->
  <rect x="40" y="668" width="1120" height="26" rx="4" fill="#f9fafb" stroke="none"/>
  <text x="60" y="685" fill="#6b7280" font-size="10" font-weight="600">Pipeline Data Flow:</text>
  <rect x="180" y="676" width="10" height="10" rx="2" fill="#2563eb"/>
  <text x="196" y="685" fill="#6b7280" font-size="10">Stage 1 分类</text>
  <rect x="270" y="676" width="10" height="10" rx="2" fill="#9333ea"/>
  <text x="286" y="685" fill="#6b7280" font-size="10">Stage 2 语义</text>
  <rect x="360" y="676" width="10" height="10" rx="2" fill="#16a34a"/>
  <text x="376" y="685" fill="#6b7280" font-size="10">Stage 3 存储</text>
  <rect x="450" y="676" width="10" height="10" rx="2" fill="#ea580c"/>
  <text x="466" y="685" fill="#6b7280" font-size="10">Stage 4 边</text>
  <rect x="520" y="676" width="10" height="10" rx="2" fill="#dc2626"/>
  <text x="536" y="685" fill="#6b7280" font-size="10">Stage 5 功能</text>

  <text x="680" y="685" fill="#6b7280" font-size="10" font-weight="600">Graph Entities:</text>
  <rect x="770" y="676" width="10" height="10" rx="2" fill="#dbeafe"/>
  <text x="786" y="685" fill="#6b7280" font-size="10">:UIState</text>
  <rect x="840" y="676" width="10" height="10" rx="2" fill="#ede9fe"/>
  <text x="856" y="685" fill="#6b7280" font-size="10">:Action</text>
  <rect x="900" y="676" width="10" height="10" rx="2" fill="#fff7ed"/>
  <text x="916" y="685" fill="#6b7280" font-size="10">:TaskTarget</text>
  <rect x="980" y="676" width="10" height="10" rx="2" fill="#fef2f2"/>
  <text x="996" y="685" fill="#6b7280" font-size="10">:Functionality</text>
</svg>