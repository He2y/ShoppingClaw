<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
  <title id="title">AMSG build pipeline</title>
  <desc id="desc">Active Mobile Spatial Graph build pipeline showing online execution staging, offline exploration, manual import, quality gates, promotability filtering, and Neo4j schema.</desc>
  <defs>
    <marker id="m-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="m-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#047857"/></marker>
    <marker id="m-red" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="m-orange" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ea580c"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #4b5563; }
      .section { fill: #fbfcfe; stroke: #cbd5e1; stroke-width: 1.2; }
      .section-title { font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: .5px; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.3; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #047857; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .small { font-size: 10.5px; fill: #475569; }
      .tiny { font-size: 9.5px; fill: #64748b; }
      .line { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .data { stroke: #2563eb; marker-end: url(#m-blue); }
      .graph { stroke: #047857; marker-end: url(#m-green); }
      .drop { stroke: #dc2626; marker-end: url(#m-red); }
      .action { stroke: #ea580c; marker-end: url(#m-orange); }
      .label { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#fff"/>
  <text class="title" x="640" y="36" text-anchor="middle">AMSG v4.1: Quality-Controlled Graph Evolution</text>
  <text class="subtitle" x="640" y="58" text-anchor="middle">The Active Mobile Spatial Graph stores reusable semantic navigation knowledge, not raw UI noise or transient shopping data.</text>

  <!-- Three sources -->
  <rect class="section" x="40" y="86" width="1200" height="196" rx="10"/>
  <text class="section-title" x="62" y="112">GRAPH KNOWLEDGE SOURCES</text>
  <rect class="box blue" x="74" y="136" width="286" height="92" rx="9"/>
  <text class="name" x="217" y="162" text-anchor="middle">Online Execution</text>
  <text class="small" x="217" y="182" text-anchor="middle">agent.py run, every step</text>
  <text class="small" x="217" y="200" text-anchor="middle">record_observation(persist=false)</text>
  <text class="tiny" x="217" y="218" text-anchor="middle">writes only _local_states and _local_edges</text>
  <rect class="box green" x="498" y="136" width="286" height="92" rx="9"/>
  <text class="name" x="641" y="162" text-anchor="middle">OfflineExplorer</text>
  <text class="small" x="641" y="182" text-anchor="middle">human-triggered pre-exploration</text>
  <text class="small" x="641" y="200" text-anchor="middle">PageClassifier + VLM semantics</text>
  <text class="tiny" x="641" y="218" text-anchor="middle">batch quality report before persistence</text>
  <rect class="box orange" x="922" y="136" width="286" height="92" rx="9"/>
  <text class="name" x="1065" y="162" text-anchor="middle">Manual Import</text>
  <text class="small" x="1065" y="182" text-anchor="middle">reviewed trajectories</text>
  <text class="small" x="1065" y="200" text-anchor="middle">persist=true only after audit</text>
  <text class="tiny" x="1065" y="218" text-anchor="middle">human curated recovery path</text>

  <polygon points="217,248 294,252 217,278 140,252" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text class="small" x="217" y="256" text-anchor="middle">task</text>
  <text class="small" x="217" y="270" text-anchor="middle">success?</text>
  <path class="line data" d="M217 228 V244"/>
  <path class="line drop" d="M140 252 C96 272 96 304 160 320"/>
  <text class="label" x="104" y="295" fill="#dc2626">No: discard</text>

  <!-- Main pipeline -->
  <rect class="section" x="40" y="318" width="1200" height="238" rx="10"/>
  <text class="section-title" x="62" y="344">FIVE-STAGE AMSG PIPELINE</text>
  <rect class="box blue" x="76" y="382" width="150" height="72" rx="8"/>
  <text class="name" x="151" y="408" text-anchor="middle">1. Observe</text>
  <text class="small" x="151" y="426" text-anchor="middle">screenshot, action</text>
  <text class="tiny" x="151" y="442" text-anchor="middle">state_id hash</text>
  <rect class="box green" x="284" y="382" width="170" height="72" rx="8"/>
  <text class="name" x="369" y="408" text-anchor="middle">2. Semantic Node</text>
  <text class="small" x="369" y="426" text-anchor="middle">PageNode</text>
  <text class="tiny" x="369" y="442" text-anchor="middle">landmarks, affordances, slots, risk</text>
  <rect class="box orange" x="512" y="382" width="170" height="72" rx="8"/>
  <text class="name" x="597" y="408" text-anchor="middle">3. Edge Extract</text>
  <text class="small" x="597" y="426" text-anchor="middle">AffordanceEdge</text>
  <text class="tiny" x="597" y="442" text-anchor="middle">intent, target, cost, confidence</text>
  <rect class="box green" x="740" y="382" width="170" height="72" rx="8"/>
  <text class="name" x="825" y="408" text-anchor="middle">4. Canonicalize</text>
  <text class="small" x="825" y="426" text-anchor="middle">merge duplicates</text>
  <text class="tiny" x="825" y="442" text-anchor="middle">semantic signature</text>
  <rect class="box green" x="968" y="382" width="170" height="72" rx="8"/>
  <text class="name" x="1053" y="408" text-anchor="middle">5. Promote</text>
  <text class="small" x="1053" y="426" text-anchor="middle">filter then persist</text>
  <text class="tiny" x="1053" y="442" text-anchor="middle">Neo4j canonical graph</text>
  <path class="line data" d="M226 418 H280"/>
  <path class="line action" d="M454 418 H508"/>
  <path class="line graph" d="M682 418 H736"/>
  <path class="line graph" d="M910 418 H964"/>
  <path class="line graph" d="M294 252 C360 304 610 342 824 378"/>
  <path class="line graph" d="M641 228 C652 292 730 342 824 378"/>
  <path class="line graph" d="M1065 228 C1070 292 1062 342 1054 378"/>

  <rect class="box red" x="112" y="486" width="246" height="46" rx="7"/>
  <text class="name" x="235" y="506" text-anchor="middle">Pollution Removed</text>
  <text class="small" x="235" y="523" text-anchor="middle">failed tasks, self loops, low-quality edges</text>
  <rect class="box green" x="442" y="486" width="390" height="46" rx="7"/>
  <text class="name" x="637" y="506" text-anchor="middle">Reusable Knowledge Kept</text>
  <text class="small" x="637" y="523" text-anchor="middle">stable page types, navigable actions, successful transitions, confidence statistics</text>
  <rect class="box red" x="916" y="486" width="246" height="46" rx="7"/>
  <text class="name" x="1039" y="506" text-anchor="middle">Transient Data Dropped</text>
  <text class="small" x="1039" y="523" text-anchor="middle">price, title, shop name, rank index</text>

  <!-- Schema and filters -->
  <rect class="section" x="40" y="586" width="590" height="260" rx="10"/>
  <text class="section-title" x="62" y="612">PROMOTABILITY FILTER</text>
  <rect class="box green" x="80" y="642" width="220" height="84" rx="8"/>
  <text class="name" x="190" y="668" text-anchor="middle">Functionality</text>
  <text class="small" x="190" y="688" text-anchor="middle">is_promotable = true</text>
  <text class="tiny" x="190" y="706" text-anchor="middle">open_search, open_spec, add_to_cart</text>
  <rect class="box red" x="360" y="642" width="220" height="84" rx="8"/>
  <text class="name" x="470" y="668" text-anchor="middle">Data Item</text>
  <text class="small" x="470" y="688" text-anchor="middle">is_promotable = false</text>
  <text class="tiny" x="470" y="706" text-anchor="middle">price, title, shop, count, ad text</text>
  <path class="line graph" d="M190 726 C220 774 300 794 368 806"/>
  <path class="line drop" d="M470 726 C442 770 446 798 496 808"/>
  <rect class="box green" x="80" y="778" width="220" height="42" rx="7"/>
  <text class="small" x="190" y="803" text-anchor="middle">persist to Neo4j</text>
  <rect class="box red" x="360" y="778" width="220" height="42" rx="7"/>
  <text class="small" x="470" y="803" text-anchor="middle">discard from graph store</text>

  <rect class="section" x="690" y="586" width="550" height="260" rx="10"/>
  <text class="section-title" x="712" y="612">NEO4J STORAGE MODEL</text>
  <rect class="box blue" x="732" y="650" width="132" height="56" rx="8"/>
  <text class="name" x="798" y="681" text-anchor="middle">UIState</text>
  <rect class="box orange" x="916" y="650" width="132" height="56" rx="8"/>
  <text class="name" x="982" y="681" text-anchor="middle">Action</text>
  <rect class="box blue" x="1100" y="650" width="100" height="56" rx="8"/>
  <text class="name" x="1150" y="681" text-anchor="middle">UIState</text>
  <path class="line action" d="M864 678 H912"/>
  <path class="line graph" d="M1048 678 H1096"/>
  <text class="tiny" x="888" y="664" text-anchor="middle">NEXT_ACTION</text>
  <text class="tiny" x="1074" y="664" text-anchor="middle">PRODUCES</text>
  <rect class="box green" x="732" y="754" width="162" height="42" rx="7"/>
  <text class="small" x="813" y="779" text-anchor="middle">FunctionalityItem</text>
  <rect class="box green" x="948" y="754" width="162" height="42" rx="7"/>
  <text class="small" x="1029" y="779" text-anchor="middle">FunctionalityCluster</text>
  <rect class="box orange" x="732" y="810" width="162" height="26" rx="6"/>
  <text class="tiny" x="813" y="827" text-anchor="middle">TaskTarget STARTS_AT</text>
  <path class="line graph" d="M798 706 V750"/>
  <path class="line graph" d="M982 706 C992 734 1006 740 1029 750"/>
</svg>
