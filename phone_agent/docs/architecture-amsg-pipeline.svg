<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Graph building pipeline</title>
  <desc id="desc">Pipeline for online learning, offline exploration, canonical staging, quality gates, lifecycle verification, and Neo4j persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 16; }
      .online { fill: #e0f2fe; stroke: #0284c7; }
      .offline { fill: #ecfeff; stroke: #0891b2; }
      .stage { fill: #fefce8; stroke: #ca8a04; }
      .quality { fill: #fff1f2; stroke: #e11d48; }
      .persist { fill: #f0fdf4; stroke: #16a34a; }
      .boxTitle { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 12.5px Arial, sans-serif; fill: #334155; }
      .caption { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text class="title" x="55" y="54">AMSG Construction Pipeline</text>
  <text class="subtitle" x="55" y="80">The graph is built from online postcondition observations and offline exploration artifacts, then canonicalized before persistence.</text>

  <rect class="lane" x="50" y="125" width="320" height="660"/>
  <text class="caption" x="75" y="160">Online Runtime</text>
  <rect class="online" x="85" y="200" width="235" height="72" rx="10"/>
  <text class="boxTitle" x="110" y="229">Execute Action</text>
  <text class="text" x="110" y="251">VLM, Fast Path, or RuntimeDAG</text>
  <rect class="online" x="85" y="320" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="110" y="349">Cache Pending Edge</text>
  <text class="text" x="110" y="371">source PageState</text>
  <text class="text" x="110" y="389">action and expected postcondition</text>
  <rect class="online" x="85" y="455" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="110" y="484">Next Observation</text>
  <text class="text" x="110" y="506">classify target screen</text>
  <text class="text" x="110" y="524">record success or failure</text>
  <path class="line" d="M203 272 V320"/>
  <path class="line" d="M203 406 V455"/>

  <rect class="lane" x="410" y="125" width="320" height="660"/>
  <text class="caption" x="435" y="160">Offline Exploration</text>
  <rect class="offline" x="445" y="200" width="235" height="78" rx="10"/>
  <text class="boxTitle" x="470" y="229">PageClassifier</text>
  <text class="text" x="470" y="251">page, elements, summary</text>
  <rect class="offline" x="445" y="325" width="235" height="92" rx="10"/>
  <text class="boxTitle" x="470" y="354">Supervisor-Executor</text>
  <text class="text" x="470" y="376">coverage-driven exploration</text>
  <text class="text" x="470" y="394">safe action policy</text>
  <rect class="offline" x="445" y="465" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="470" y="494">Artifacts</text>
  <text class="text" x="470" y="516">pages, transitions, trajectory,</text>
  <text class="text" x="470" y="534">lifecycle and report JSON</text>
  <path class="line" d="M563 278 V325"/>
  <path class="line" d="M563 417 V465"/>

  <rect class="lane" x="770" y="125" width="320" height="660"/>
  <text class="caption" x="795" y="160">Canonical Staging</text>
  <rect class="stage" x="805" y="190" width="235" height="76" rx="10"/>
  <text class="boxTitle" x="830" y="219">Canonicalize Pages</text>
  <text class="text" x="830" y="241">merge by app, page_type, risk</text>
  <rect class="stage" x="805" y="310" width="235" height="92" rx="10"/>
  <text class="boxTitle" x="830" y="339">Transform Transitions</text>
  <text class="text" x="830" y="361">compact same-page runs</text>
  <text class="text" x="830" y="379">synthesize slot macros</text>
  <rect class="stage" x="805" y="450" width="235" height="92" rx="10"/>
  <text class="boxTitle" x="830" y="479">Functionality Layer</text>
  <text class="text" x="830" y="501">extract items and clusters</text>
  <text class="text" x="830" y="519">link roles to actions</text>
  <rect class="quality" x="805" y="590" width="235" height="92" rx="10"/>
  <text class="boxTitle" x="830" y="619">Quality Gate</text>
  <text class="text" x="830" y="641">drop transient, cross-app,</text>
  <text class="text" x="830" y="659">high-risk executable edges</text>
  <path class="line" d="M923 266 V310"/>
  <path class="line" d="M923 402 V450"/>
  <path class="line" d="M923 542 V590"/>

  <rect class="lane" x="1130" y="125" width="320" height="660"/>
  <text class="caption" x="1155" y="160">Persistence and Reuse</text>
  <rect class="persist" x="1165" y="205" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="1190" y="234">Edge Lifecycle</text>
  <text class="text" x="1190" y="256">outcome distribution</text>
  <text class="text" x="1190" y="274">promotion or demotion</text>
  <rect class="persist" x="1165" y="345" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="1190" y="374">Neo4j Upsert</text>
  <text class="text" x="1190" y="396">UIState, Action,</text>
  <text class="text" x="1190" y="414">Functionality nodes</text>
  <rect class="persist" x="1165" y="485" width="235" height="86" rx="10"/>
  <text class="boxTitle" x="1190" y="514">Runtime Reload</text>
  <text class="text" x="1190" y="536">load lifecycle records</text>
  <text class="text" x="1190" y="554">serve route candidates</text>
  <rect class="persist" x="1165" y="625" width="235" height="74" rx="10"/>
  <text class="boxTitle" x="1190" y="654">Action Library</text>
  <text class="text" x="1190" y="676">promoted grounded hints</text>
  <path class="line" d="M1283 291 V345"/>
  <path class="line" d="M1283 431 V485"/>
  <path class="line" d="M1283 571 V625"/>

  <path class="line" d="M320 500 H805"/>
  <path class="line" d="M680 508 H805"/>
  <path class="line" d="M1040 636 H1165"/>
  <path class="dash" d="M1400 662 C1460 790 180 815 203 541"/>
  <path class="dash" d="M1165 248 H1040"/>
  <text class="subtitle" x="75" y="835">Only successful tasks flush online observations; failed trajectories remain reviewable but do not automatically contaminate the executable graph.</text>
</svg>
