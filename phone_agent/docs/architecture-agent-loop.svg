<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Agent execution loop with Navigate Explore Verify modes</title>
  <desc id="desc">Detailed execution flow from clarification through screenshot, graph localization, route decision, navigate explore verify branches, state update, and gated graph commit.</desc>
  <defs>
    <marker id="m-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="m-green" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#047857"/></marker>
    <marker id="m-purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="m-red" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="m-orange" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ea580c"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #4b5563; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.35; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #047857; }
      .purple { fill: #faf5ff; stroke: #7c3aed; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .small { font-size: 10.5px; fill: #475569; }
      .tiny { font-size: 9.5px; fill: #64748b; }
      .line { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .data { stroke: #2563eb; marker-end: url(#m-blue); }
      .graph { stroke: #047857; marker-end: url(#m-green); }
      .vlm { stroke: #7c3aed; marker-end: url(#m-purple); }
      .risk { stroke: #dc2626; marker-end: url(#m-red); }
      .action { stroke: #ea580c; marker-end: url(#m-orange); }
      .label { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="980" fill="#fff"/>
  <text class="title" x="640" y="36" text-anchor="middle">ClawGUI-Agent Execution Loop</text>
  <text class="subtitle" x="640" y="58" text-anchor="middle">Every step chooses among graph navigation, VLM exploration, and safety verification; graph learning is staged until the task succeeds.</text>

  <!-- Main vertical backbone -->
  <rect class="box orange" x="430" y="86" width="420" height="82" rx="10"/>
  <text class="name" x="640" y="112" text-anchor="middle">0. Task Clarification</text>
  <text class="small" x="640" y="132" text-anchor="middle">TaskSpecExtractor: rule-based slots (0 ms)</text>
  <text class="small" x="640" y="149" text-anchor="middle">Memory preference fills missing specs; VLM asks only if ambiguity remains</text>

  <rect class="box blue" x="430" y="206" width="420" height="70" rx="10"/>
  <text class="name" x="640" y="232" text-anchor="middle">1. Observe</text>
  <text class="small" x="640" y="251" text-anchor="middle">device screenshot bytes -> base64 for VLM, MD5 state_id for dedup, current_app detection</text>
  <path class="line data" d="M640 168 V202"/>

  <rect class="box blue" x="430" y="314" width="420" height="76" rx="10"/>
  <text class="name" x="640" y="340" text-anchor="middle">2. Page Semantics</text>
  <text class="small" x="640" y="359" text-anchor="middle">PageClassifier -> page_type + summary</text>
  <text class="small" x="640" y="376" text-anchor="middle">ScreenSemanticsExtractor -> PageNode(landmarks, affordances, slots, risk)</text>
  <path class="line data" d="M640 276 V310"/>

  <rect class="box green" x="430" y="428" width="420" height="76" rx="10"/>
  <text class="name" x="640" y="454" text-anchor="middle">3. Graph Localization and Planning</text>
  <text class="small" x="640" y="473" text-anchor="middle">SpatialGraphMemory.locate() -> PageBelief(confidence, candidate node)</text>
  <text class="small" x="640" y="490" text-anchor="middle">plan(goal) -> RoutePlan(next edge, cost, postcondition)</text>
  <path class="line graph" d="M640 390 V424"/>

  <polygon points="640,548 742,604 640,660 538,604" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text class="name" x="640" y="597" text-anchor="middle">4. RuntimeController</text>
  <text class="small" x="640" y="616" text-anchor="middle">confidence, risk, novelty</text>
  <path class="line action" d="M640 504 V544"/>

  <!-- Branches -->
  <rect class="box green" x="70" y="560" width="270" height="138" rx="10"/>
  <text class="name" x="205" y="586" text-anchor="middle">Navigate Mode</text>
  <text class="small" x="205" y="607" text-anchor="middle">Trigger: graph route exists, confidence >= 0.7, risk normal</text>
  <text class="small" x="205" y="628" text-anchor="middle">SpatialModelBridge.compile_direct_action()</text>
  <text class="small" x="205" y="649" text-anchor="middle">DeviceActionIR(click/swipe/text, normalized space)</text>
  <text class="tiny" x="205" y="674" text-anchor="middle">Effect: skip VLM, reduce each known step from seconds to milliseconds</text>
  <path class="line graph" d="M538 604 H344"/>
  <text class="label" x="440" y="592" fill="#047857" text-anchor="middle">known low-risk route</text>

  <rect class="box purple" x="505" y="710" width="270" height="154" rx="10"/>
  <text class="name" x="640" y="736" text-anchor="middle">Explore Mode</text>
  <text class="small" x="640" y="757" text-anchor="middle">Trigger: novel page, no candidate, or confidence &lt; 0.5</text>
  <text class="small" x="640" y="778" text-anchor="middle">Adapter.build_messages() with screenshot and action history</text>
  <text class="small" x="640" y="799" text-anchor="middle">Inject graph semantics + memory progress + SpecGuard hints</text>
  <text class="small" x="640" y="820" text-anchor="middle">VLM thinking/action -> ProtocolBridge -> DeviceActionIR</text>
  <text class="tiny" x="640" y="846" text-anchor="middle">Observation is staged locally, not written to Neo4j immediately</text>
  <path class="line vlm" d="M640 660 V706"/>
  <text class="label" x="681" y="688" fill="#7c3aed">novel/uncertain</text>

  <rect class="box red" x="940" y="560" width="270" height="138" rx="10"/>
  <text class="name" x="1075" y="586" text-anchor="middle">Verify Mode</text>
  <text class="small" x="1075" y="607" text-anchor="middle">Trigger: payment, checkout, login, address, or submit action</text>
  <text class="small" x="1075" y="628" text-anchor="middle">VLM validates current screenshot against expected specs</text>
  <text class="small" x="1075" y="649" text-anchor="middle">SpecGuard checks SKU mismatch and may return Interact</text>
  <text class="tiny" x="1075" y="674" text-anchor="middle">Effect: graph paths cannot bypass high-risk verification</text>
  <path class="line risk" d="M742 604 H936"/>
  <text class="label" x="840" y="592" fill="#dc2626" text-anchor="middle">high-risk page/action</text>

  <!-- Convergence to execution/state -->
  <rect class="box orange" x="430" y="575" width="420" height="58" rx="10"/>
  <text class="name" x="640" y="598" text-anchor="middle">5. Execute Device Action</text>
  <text class="small" x="640" y="617" text-anchor="middle">DeviceFactory dispatches to Android ADB, HarmonyOS HDC, or iOS XCTest/WDA</text>
  <path class="line action" d="M340 644 C388 644 405 616 426 606"/>
  <path class="line action" d="M940 644 C892 644 875 616 854 606"/>
  <path class="line action" d="M640 710 V637"/>

  <rect class="box green" x="430" y="892" width="420" height="58" rx="10"/>
  <text class="name" x="640" y="915" text-anchor="middle">7. Task End: Gated Graph Commit</text>
  <text class="small" x="640" y="934" text-anchor="middle">success -> flush_staged_graph() -> canonicalize -> promote -> Neo4j; failure -> discard staging</text>

  <rect class="box orange" x="70" y="760" width="300" height="88" rx="10"/>
  <text class="name" x="220" y="786" text-anchor="middle">6. Runtime State Update</text>
  <text class="small" x="220" y="807" text-anchor="middle">MemoryManager.record_step()</text>
  <text class="small" x="220" y="826" text-anchor="middle">RetrievalGateway checks uncertainty/comparison/stagnation</text>
  <text class="small" x="220" y="844" text-anchor="middle">record_observation(persist=false)</text>
  <path class="line action" d="M430 604 C335 624 262 706 227 756"/>
  <path class="line action" d="M505 796 H374"/>
  <path class="line action" d="M940 644 C806 700 540 780 374 804"/>
  <path class="line graph" d="M370 826 C450 890 544 892 636 888"/>

  <!-- Loop and stop -->
  <polygon points="1042,780 1118,822 1042,864 966,822" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text class="name" x="1042" y="818" text-anchor="middle">finished?</text>
  <text class="tiny" x="1042" y="835" text-anchor="middle">terminate / answer / max_steps</text>
  <path class="line data" d="M370 804 H962"/>
  <path class="line data" d="M966 822 H80 V241 H426"/>
  <text class="label" x="92" y="810" fill="#2563eb">No: continue loop</text>
  <path class="line graph" d="M1042 864 C996 932 910 922 854 922"/>
  <text class="label" x="1014" y="912" fill="#047857">Yes</text>

  <rect x="36" y="922" width="324" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <path class="line graph" d="M54 941 H92"/>
  <text class="tiny" x="102" y="944">graph route/write</text>
  <path class="line vlm" d="M210 941 H248"/>
  <text class="tiny" x="258" y="944">VLM reasoning path</text>
</svg>
