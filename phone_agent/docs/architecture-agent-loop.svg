<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">Agent Execution Loop v4.1</text>
  <text x="600" y="52" text-anchor="middle" fill="#6b7280" font-size="12">ClarificationAgent 三层短路 → Navigate / Explore / Verify → 门控图谱写入</text>

  <!-- User -->
  <circle cx="600" cy="80" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="85" text-anchor="middle" fill="#2563eb" font-size="14">👤</text>
  <text x="600" y="108" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">用户任务</text>
  <line x1="600" y1="114" x2="600" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ═══ ClarificationAgent (NEW prominent section) ═══ -->
  <rect x="340" y="136" width="520" height="88" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="366" y="158" fill="#ea580c" font-size="14">🔍</text>
  <text x="386" y="158" fill="#c2410c" font-size="13" font-weight="700">ClarificationAgent 三层短路</text>
  <text x="366" y="178" fill="#9a3412" font-size="10">Layer 1: TaskSpecExtractor → 非购物? → CLEAR (0ms)</text>
  <text x="366" y="194" fill="#9a3412" font-size="10">Layer 2: Memory 偏好 → 缺失槽位填满? → CLEAR + 偏好注入</text>
  <text x="366" y="210" fill="#9a3412" font-size="10">Layer 3: VLM 歧义检测 → 询问用户 → 重组任务文本</text>
  <line x1="600" y1="224" x2="600" y2="242" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Phase 1: Screenshot -->
  <rect x="430" y="248" width="340" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="270" fill="#2563eb" font-size="13">📱</text>
  <text x="476" y="270" fill="#1e40af" font-size="12" font-weight="700">Phase 1: 截图 &amp; 感知</text>
  <text x="600" y="288" text-anchor="middle" fill="#3b82f6" font-size="10">screenshot → MD5 → get_current_app()</text>
  <line x1="600" y1="296" x2="600" y2="312" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2: Graph Localization -->
  <rect x="370" y="318" width="460" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="396" y="342" fill="#16a34a" font-size="13">🗺️</text>
  <text x="416" y="342" fill="#166534" font-size="12" font-weight="700">Phase 2: 图谱定位 &amp; 路由</text>
  <text x="600" y="362" text-anchor="middle" fill="#15803d" font-size="10">PageClassifier → SemanticExtractor → locate() → plan() → mode + confidence</text>

  <!-- Decision Diamond -->
  <line x1="600" y1="376" x2="600" y2="398" stroke="#111827" stroke-width="1.5"/>
  <polygon points="600,404 680,446 600,488 520,446" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="442" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="600">路由判断</text>
  <text x="600" y="458" text-anchor="middle" fill="#9a3412" font-size="9">mode? conf? risk?</text>

  <!-- LEFT: Navigate -->
  <line x1="520" y1="446" x2="250" y2="446" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="316" y="432" width="168" height="16" rx="3" fill="#fff" stroke="none"/>
  <text x="400" y="444" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="600">navigate + conf ≥ 0.7</text>
  <rect x="60" y="418" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="440" fill="#16a34a" font-size="14">⚡</text>
  <text x="108" y="440" fill="#166534" font-size="13" font-weight="700">Navigate</text>
  <text x="155" y="458" text-anchor="middle" fill="#166534" font-size="10">SpatialModelBridge</text>
  <text x="155" y="470" text-anchor="middle" fill="#166534" font-size="10">.compile_direct_action()</text>
  <text x="155" y="494" text-anchor="middle" fill="#15803d" font-size="9" font-weight="600">跳过 VLM · 毫秒级延迟</text>

  <!-- RIGHT: Verify -->
  <line x1="680" y1="446" x2="950" y2="446" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="736" y="432" width="170" height="16" rx="3" fill="#fff" stroke="none"/>
  <text x="821" y="444" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="600">risk_level = "high"</text>
  <rect x="950" y="418" width="190" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="976" y="440" fill="#dc2626" font-size="14">🛡️</text>
  <text x="996" y="440" fill="#991b1b" font-size="13" font-weight="700">Verify</text>
  <text x="1045" y="458" text-anchor="middle" fill="#991b1b" font-size="10">VLM 推理 + SpecGuard</text>
  <text x="1045" y="470" text-anchor="middle" fill="#991b1b" font-size="10">payment/checkout 强制验证</text>

  <!-- MIDDLE: Explore -->
  <line x1="600" y1="488" x2="600" y2="514" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="545" y="492" width="110" height="16" rx="3" fill="#fff" stroke="none"/>
  <text x="600" y="504" text-anchor="middle" fill="#9333ea" font-size="10" font-weight="600">explore / 低置信</text>
  <rect x="430" y="520" width="340" height="102" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="542" fill="#9333ea" font-size="14">🧠</text>
  <text x="476" y="542" fill="#5b21b6" font-size="13" font-weight="700">Explore (VLM 推理)</text>
  <text x="456" y="560" fill="#6b21a8" font-size="10">① Adapter.build_messages()</text>
  <text x="456" y="574" fill="#6b21a8" font-size="10">② 注入: 图谱语义 + 记忆进度 + SpecGuard</text>
  <text x="456" y="588" fill="#6b21a8" font-size="10">③ ModelClient.request() → thinking + action</text>
  <text x="456" y="602" fill="#6b21a8" font-size="10">④ Parse → ProtocolBridge → 执行</text>

  <!-- Converge -->
  <line x1="155" y1="478" x2="155" y2="656" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="155" y1="656" x2="426" y2="656" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="622" x2="600" y2="646" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="1045" y1="478" x2="1045" y2="656" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="1045" y1="656" x2="774" y2="656" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Phase 4: State Update (UPDATED) -->
  <rect x="430" y="640" width="340" height="74" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="456" y="662" fill="#ea580c" font-size="13">📝</text>
  <text x="476" y="662" fill="#9a3412" font-size="12" font-weight="700">Phase 4: 状态更新 &amp; 本地暂存</text>
  <text x="600" y="682" text-anchor="middle" fill="#c2410c" font-size="10">UnifiedState.record_step() → MemoryManager.update_transition()</text>
  <text x="600" y="698" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="600">record_observation(persist=False) → 仅写本地缓存</text>

  <!-- Decision: Finished? -->
  <line x1="600" y1="714" x2="600" y2="736" stroke="#111827" stroke-width="1.5"/>
  <polygon points="600,742 660,772 600,802 540,772" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="600" y="770" text-anchor="middle" fill="#374151" font-size="11" font-weight="600">完成?</text>
  <text x="600" y="784" text-anchor="middle" fill="#6b7280" font-size="9">finished / max_steps</text>

  <!-- Loop back -->
  <line x1="540" y1="772" x2="60" y2="772" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="60" y1="772" x2="60" y2="272" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="60" y1="272" x2="426" y2="272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="68" y="510" width="56" height="16" rx="3" fill="#eff6ff"/>
  <text x="96" y="522" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">继续</text>

  <!-- Finished → Phase 5 -->
  <line x1="600" y1="802" x2="600" y2="826" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="830" width="440" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="406" y="854" fill="#2563eb" font-size="13">✅</text>
  <text x="426" y="854" fill="#1e40af" font-size="12" font-weight="700">Phase 5: 任务结束 &amp; 图谱提交</text>
  <text x="600" y="874" text-anchor="middle" fill="#3b82f6" font-size="10">成功 → flush_staged_graph() → canonicalize → promote → Neo4j</text>
  <text x="600" y="886" text-anchor="middle" fill="#dc2626" font-size="10">失败 → 不写入图谱 (避免坏转换)</text>

  <!-- Labels -->
  <rect x="606" y="800" width="30" height="14" rx="3" fill="#fff"/>
  <text x="621" y="811" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="600">Yes</text>
  <rect x="498" y="762" width="24" height="14" rx="3" fill="#fff"/>
  <text x="510" y="773" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">No</text>

  <!-- Legend -->
  <rect x="40" y="904" width="540" height="48" rx="6" fill="#f9fafb" stroke="none"/>
  <line x1="50" y1="922" x2="78" y2="922" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="84" y="926" fill="#6b7280" font-size="10">Clarify</text>
  <line x1="130" y1="922" x2="158" y2="922" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="164" y="926" fill="#6b7280" font-size="10">Navigate</text>
  <line x1="220" y1="922" x2="248" y2="922" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="254" y="926" fill="#6b7280" font-size="10">Explore</text>
  <line x1="308" y1="922" x2="336" y2="922" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="342" y="926" fill="#6b7280" font-size="10">Verify</text>
  <line x1="388" y1="922" x2="416" y2="922" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="422" y="926" fill="#6b7280" font-size="10">Loop</text>
  <text x="486" y="926" fill="#6b7280" font-size="10" font-weight="600">v4.1: 本地暂存 + 门控写入</text>
</svg>