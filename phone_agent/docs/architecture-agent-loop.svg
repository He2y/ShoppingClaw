<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Agent execution loop</title>
  <desc id="desc">Detailed single-step loop from screenshot observation to graph localization, dispatch, execution, verification, and memory update.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .phase { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 16; }
      .obs { fill: #e0f2fe; stroke: #0284c7; }
      .graph { fill: #ecfeff; stroke: #0891b2; }
      .vlm { fill: #f0fdf4; stroke: #16a34a; }
      .exec { fill: #fefce8; stroke: #ca8a04; }
      .safe { fill: #fff1f2; stroke: #e11d48; }
      .boxTitle { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 12.5px Arial, sans-serif; fill: #334155; }
      .caption { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1500" height="860" fill="#ffffff"/>
  <text class="title" x="55" y="54">Single-Step Execution Logic</text>
  <text class="subtitle" x="55" y="80">Each step updates both the dialogue policy and the graph posterior; graph execution remains conditional on confidence, risk, and postcondition checks.</text>

  <rect class="phase" x="50" y="120" width="310" height="620"/>
  <text class="caption" x="75" y="153">1. Observe</text>
  <rect class="obs" x="80" y="185" width="230" height="72" rx="10"/>
  <text class="boxTitle" x="105" y="214">Screenshot</text>
  <text class="text" x="105" y="236">device backend captures image</text>
  <rect class="obs" x="80" y="295" width="230" height="88" rx="10"/>
  <text class="boxTitle" x="105" y="324">PageClassifier</text>
  <text class="text" x="105" y="346">page_type, summary, elements</text>
  <text class="text" x="105" y="366">skipped only by valid RuntimeDAG</text>
  <rect class="safe" x="80" y="420" width="230" height="86" rx="10"/>
  <text class="boxTitle" x="105" y="449">Verification Detector</text>
  <text class="text" x="105" y="471">login, captcha, permission</text>
  <text class="text" x="105" y="491">routes to human takeover</text>
  <path class="line" d="M195 257 V295"/>
  <path class="line" d="M195 383 V420"/>

  <rect class="phase" x="410" y="120" width="340" height="620"/>
  <text class="caption" x="435" y="153">2. Localize and Plan</text>
  <rect class="graph" x="455" y="185" width="250" height="82" rx="10"/>
  <text class="boxTitle" x="480" y="214">Build PageState</text>
  <text class="text" x="480" y="236">semantic signature from app, type,</text>
  <text class="text" x="480" y="254">landmarks, affordances, slots</text>
  <rect class="graph" x="455" y="310" width="250" height="96" rx="10"/>
  <text class="boxTitle" x="480" y="339">Belief Localization</text>
  <text class="text" x="480" y="361">graph candidate plus observation</text>
  <text class="text" x="480" y="379">fixed score or Bayesian posterior</text>
  <rect class="graph" x="455" y="450" width="250" height="96" rx="10"/>
  <text class="boxTitle" x="480" y="479">GoalSpec and Route</text>
  <text class="text" x="480" y="501">slots from task and VLM pre-plan</text>
  <text class="text" x="480" y="519">Dijkstra, A*, or belief-aware A*</text>
  <rect class="graph" x="455" y="585" width="250" height="70" rx="10"/>
  <text class="boxTitle" x="480" y="614">RuntimeDAG</text>
  <text class="text" x="480" y="636">cache route and next action</text>
  <path class="line" d="M580 267 V310"/>
  <path class="line" d="M580 406 V450"/>
  <path class="line" d="M580 546 V585"/>

  <rect class="phase" x="800" y="120" width="330" height="620"/>
  <text class="caption" x="825" y="153">3. Dispatch</text>
  <polygon class="decision" points="965,185 1085,245 965,305 845,245"/>
  <text class="boxTitle" x="927" y="241">Grounded?</text>
  <text class="text" x="918" y="261">confidence, risk, slots</text>
  <rect class="exec" x="845" y="350" width="250" height="84" rx="10"/>
  <text class="boxTitle" x="870" y="379">Fast Path</text>
  <text class="text" x="870" y="401">execute promoted action</text>
  <text class="text" x="870" y="419">no VLM call</text>
  <rect class="vlm" x="845" y="500" width="250" height="102" rx="10"/>
  <text class="boxTitle" x="870" y="529">Full VLM Path</text>
  <text class="text" x="870" y="551">inject plan, memory, graph hints</text>
  <text class="text" x="870" y="569">VLM chooses semantic target</text>
  <text class="text" x="870" y="587">ActionAdvisor may ground coords</text>
  <path class="line" d="M965 305 V350"/>
  <path class="dash" d="M845 245 C790 330 790 455 845 551"/>
  <text class="text" x="1075" y="330">yes</text>
  <text class="text" x="806" y="435">no or semantic choice</text>

  <rect class="phase" x="1180" y="120" width="270" height="620"/>
  <text class="caption" x="1205" y="153">4. Execute and Learn</text>
  <rect class="exec" x="1210" y="190" width="205" height="78" rx="10"/>
  <text class="boxTitle" x="1235" y="219">ActionHandler</text>
  <text class="text" x="1235" y="241">device action execution</text>
  <rect class="safe" x="1210" y="315" width="205" height="88" rx="10"/>
  <text class="boxTitle" x="1235" y="344">Postcondition</text>
  <text class="text" x="1235" y="366">next observation verifies target</text>
  <text class="text" x="1235" y="386">repair: retry, rollback, replan</text>
  <rect class="graph" x="1210" y="455" width="205" height="96" rx="10"/>
  <text class="boxTitle" x="1235" y="484">Record Observation</text>
  <text class="text" x="1235" y="506">TransitionEdge plus outcome</text>
  <text class="text" x="1235" y="524">EdgeLifecycle update</text>
  <rect class="graph" x="1210" y="600" width="205" height="74" rx="10"/>
  <text class="boxTitle" x="1235" y="629">Flush on Success</text>
  <text class="text" x="1235" y="651">canonicalize and persist</text>
  <path class="line" d="M1312 268 V315"/>
  <path class="line" d="M1312 403 V455"/>
  <path class="line" d="M1312 551 V600"/>

  <path class="line" d="M310 339 H455"/>
  <path class="line" d="M705 620 H845"/>
  <path class="line" d="M1095 392 H1210"/>
  <path class="line" d="M1095 551 H1210"/>
  <path class="dash" d="M1210 359 C1080 320 1080 245 1085 245"/>
  <path class="dash" d="M1312 674 C1312 800 210 800 195 506"/>
  <text class="subtitle" x="70" y="815">The transition caused by step t is verified at step t+1, when the next screenshot becomes available.</text>
</svg>
