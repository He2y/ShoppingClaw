<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
  <title id="title">ClawGUI-Agent v4.1 System Architecture</title>
  <desc id="desc">Detailed layered architecture of ClawGUI-Agent including clarification, core services, runtime routing, model adapters, memory, graph, device backends, and safety gates.</desc>
  <defs>
    <marker id="m-data" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="m-graph" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#047857"/></marker>
    <marker id="m-memory" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="m-safety" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="m-action" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#ea580c"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #4b5563; }
      .section { fill: #fbfcfe; stroke: #cbd5e1; stroke-width: 1.2; }
      .section-title { font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: .5px; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.35; }
      .core { fill: #fffbeb; stroke: #ca8a04; }
      .agent { fill: #eff6ff; stroke: #2563eb; }
      .graphbox { fill: #ecfdf5; stroke: #047857; }
      .memorybox { fill: #faf5ff; stroke: #7c3aed; }
      .safetybox { fill: #fef2f2; stroke: #dc2626; }
      .modelbox { fill: #f5f3ff; stroke: #6d28d9; }
      .devicebox { fill: #fff7ed; stroke: #ea580c; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .small { font-size: 10.5px; fill: #475569; }
      .tiny { font-size: 9.5px; fill: #64748b; }
      .data { stroke: #2563eb; marker-end: url(#m-data); }
      .graph { stroke: #047857; marker-end: url(#m-graph); }
      .memory { stroke: #7c3aed; marker-end: url(#m-memory); stroke-dasharray: 6 4; }
      .safety { stroke: #dc2626; marker-end: url(#m-safety); }
      .action { stroke: #ea580c; marker-end: url(#m-action); }
      .line { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .tag { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text class="title" x="640" y="34" text-anchor="middle">ClawGUI-Agent v4.1: Hybrid VLM + AMSG Runtime</text>
  <text class="subtitle" x="640" y="56" text-anchor="middle">The system turns mobile GUI control into a gated self-evolving loop: clarify intent, route by graph when safe, reason by VLM when needed, and only persist verified knowledge.</text>

  <!-- Top intent/core lane -->
  <rect class="section" x="38" y="82" width="1204" height="128" rx="10"/>
  <text class="section-title" x="60" y="108">INTENT COMPLETION AND SHARED CORE</text>
  <rect class="box agent" x="72" y="126" width="140" height="50" rx="8"/>
  <text class="name" x="142" y="148" text-anchor="middle">User Task</text>
  <text class="small" x="142" y="165" text-anchor="middle">natural language</text>
  <rect class="box core" x="272" y="112" width="238" height="82" rx="8"/>
  <text class="name" x="391" y="136" text-anchor="middle">ClarificationAgent</text>
  <text class="small" x="391" y="154" text-anchor="middle">L1 rules -> L2 memory preference</text>
  <text class="small" x="391" y="171" text-anchor="middle">-> L3 VLM ambiguity check</text>
  <rect class="box core" x="570" y="112" width="190" height="82" rx="8"/>
  <text class="name" x="665" y="136" text-anchor="middle">TaskSpecExtractor</text>
  <text class="small" x="665" y="154" text-anchor="middle">query, product, color</text>
  <text class="small" x="665" y="171" text-anchor="middle">storage, size, contact, app</text>
  <rect class="box safetybox" x="820" y="112" width="166" height="82" rx="8"/>
  <text class="name" x="903" y="136" text-anchor="middle">SpecGuard</text>
  <text class="small" x="903" y="154" text-anchor="middle">SKU consistency</text>
  <text class="small" x="903" y="171" text-anchor="middle">before submit/payment</text>
  <rect class="box" x="1046" y="112" width="160" height="82" rx="8"/>
  <text class="name" x="1126" y="136" text-anchor="middle">StatusReporter</text>
  <text class="small" x="1126" y="154" text-anchor="middle">memory, graph</text>
  <text class="small" x="1126" y="171" text-anchor="middle">clarify, guard events</text>
  <path class="line data" d="M212 151 H268"/>
  <path class="line data" d="M510 151 H566"/>
  <path class="line safety" d="M760 151 H816"/>
  <path class="line data" d="M986 151 H1042"/>

  <!-- Runtime lane -->
  <rect class="section" x="38" y="244" width="758" height="388" rx="10"/>
  <text class="section-title" x="60" y="270">ONLINE RUNTIME LOOP</text>
  <rect class="box agent" x="78" y="292" width="178" height="70" rx="9"/>
  <text class="name" x="167" y="318" text-anchor="middle">PhoneAgent</text>
  <text class="small" x="167" y="336" text-anchor="middle">screenshot -> plan</text>
  <text class="small" x="167" y="352" text-anchor="middle">-> action -> trace</text>
  <rect class="box" x="314" y="292" width="178" height="70" rx="9"/>
  <text class="name" x="403" y="318" text-anchor="middle">Perception</text>
  <text class="small" x="403" y="336" text-anchor="middle">PageClassifier</text>
  <text class="small" x="403" y="352" text-anchor="middle">ScreenSemanticsExtractor</text>
  <rect class="box graphbox" x="550" y="292" width="206" height="70" rx="9"/>
  <text class="name" x="653" y="318" text-anchor="middle">SpatialGraphMemory</text>
  <text class="small" x="653" y="336" text-anchor="middle">locate() -> PageBelief</text>
  <text class="small" x="653" y="352" text-anchor="middle">plan() -> RoutePlan</text>
  <path class="line data" d="M256 327 H310"/>
  <path class="line graph" d="M492 327 H546"/>

  <rect class="box graphbox" x="78" y="432" width="170" height="74" rx="9"/>
  <text class="name" x="163" y="458" text-anchor="middle">Navigate</text>
  <text class="small" x="163" y="476" text-anchor="middle">known route, low risk</text>
  <text class="tiny" x="163" y="492" text-anchor="middle">VLM skipped</text>
  <rect class="box modelbox" x="310" y="432" width="170" height="74" rx="9"/>
  <text class="name" x="395" y="458" text-anchor="middle">Explore</text>
  <text class="small" x="395" y="476" text-anchor="middle">unknown/low confidence</text>
  <text class="tiny" x="395" y="492" text-anchor="middle">VLM reasoning</text>
  <rect class="box safetybox" x="542" y="432" width="170" height="74" rx="9"/>
  <text class="name" x="627" y="458" text-anchor="middle">Verify</text>
  <text class="small" x="627" y="476" text-anchor="middle">checkout/payment/login</text>
  <text class="tiny" x="627" y="492" text-anchor="middle">VLM + SpecGuard</text>
  <path class="line graph" d="M612 362 C560 396 250 392 164 428"/>
  <path class="line data" d="M653 362 C620 398 487 397 402 428"/>
  <path class="line safety" d="M704 362 C740 400 715 416 634 428"/>

  <rect class="box devicebox" x="278" y="548" width="238" height="58" rx="9"/>
  <text class="name" x="397" y="572" text-anchor="middle">Action Execution</text>
  <text class="small" x="397" y="590" text-anchor="middle">DeviceActionIR -> backend command</text>
  <path class="line action" d="M163 506 C164 536 262 552 274 576"/>
  <path class="line action" d="M395 506 V544"/>
  <path class="line action" d="M627 506 C625 536 532 552 520 576"/>
  <path class="line data" d="M278 577 H92 V327 H74"/>
  <text class="tag" x="108" y="562" fill="#2563eb">next screenshot</text>

  <!-- Model/device lane -->
  <rect class="section" x="830" y="244" width="412" height="388" rx="10"/>
  <text class="section-title" x="852" y="270">MODEL AND DEVICE ABSTRACTION</text>
  <rect class="box modelbox" x="864" y="294" width="160" height="64" rx="8"/>
  <text class="name" x="944" y="318" text-anchor="middle">ModelClient</text>
  <text class="small" x="944" y="336" text-anchor="middle">OpenAI-compatible</text>
  <rect class="box modelbox" x="1052" y="294" width="152" height="64" rx="8"/>
  <text class="name" x="1128" y="318" text-anchor="middle">Adapters</text>
  <text class="small" x="1128" y="336" text-anchor="middle">5 VLM styles</text>
  <rect class="box modelbox" x="864" y="390" width="340" height="78" rx="8"/>
  <text class="name" x="1034" y="414" text-anchor="middle">ProtocolBridge</text>
  <text class="small" x="1034" y="432" text-anchor="middle">native model coordinates -> DeviceActionIR</text>
  <text class="tiny" x="1034" y="450" text-anchor="middle">AutoGLM [0,1000], UI-TARS smart_resize, Qwen/MAI/GUI-Owl [0,999]</text>
  <rect class="box devicebox" x="864" y="504" width="340" height="76" rx="8"/>
  <text class="name" x="1034" y="528" text-anchor="middle">DeviceFactory</text>
  <text class="small" x="1034" y="546" text-anchor="middle">Android ADB | HarmonyOS HDC | iOS XCTest/WDA</text>
  <text class="tiny" x="1034" y="564" text-anchor="middle">screenshot, tap, swipe, text, app management</text>
  <path class="line data" d="M1024 326 H1048"/>
  <path class="line data" d="M1034 358 V386"/>
  <path class="line action" d="M1034 468 V500"/>
  <path class="line data" d="M480 469 C620 420 740 350 860 326"/>

  <!-- Memory/graph lane -->
  <rect class="section" x="38" y="666" width="1204" height="178" rx="10"/>
  <text class="section-title" x="60" y="692">MEMORY, GRAPH STORAGE, AND QUALITY-CONTROLLED EVOLUTION</text>
  <rect class="box memorybox" x="78" y="716" width="190" height="72" rx="8"/>
  <text class="name" x="173" y="740" text-anchor="middle">Vector Memory</text>
  <text class="small" x="173" y="758" text-anchor="middle">FAISS + embedding</text>
  <text class="tiny" x="173" y="774" text-anchor="middle">preferences, contacts, history</text>
  <rect class="box memorybox" x="318" y="716" width="190" height="72" rx="8"/>
  <text class="name" x="413" y="740" text-anchor="middle">UnifiedSession</text>
  <text class="small" x="413" y="758" text-anchor="middle">progress, products</text>
  <text class="tiny" x="413" y="774" text-anchor="middle">constraints, recent steps</text>
  <rect class="box graphbox" x="558" y="716" width="190" height="72" rx="8"/>
  <text class="name" x="653" y="740" text-anchor="middle">Local Staging</text>
  <text class="small" x="653" y="758" text-anchor="middle">_local_states/_edges</text>
  <text class="tiny" x="653" y="774" text-anchor="middle">persist=false online</text>
  <rect class="box graphbox" x="798" y="716" width="190" height="72" rx="8"/>
  <text class="name" x="893" y="740" text-anchor="middle">Quality Gate</text>
  <text class="small" x="893" y="758" text-anchor="middle">canonicalize -> promote</text>
  <text class="tiny" x="893" y="774" text-anchor="middle">filter bad edges/data items</text>
  <rect class="box graphbox" x="1038" y="716" width="148" height="72" rx="8"/>
  <text class="name" x="1112" y="740" text-anchor="middle">Neo4j AMSG</text>
  <text class="small" x="1112" y="758" text-anchor="middle">UIState-Action</text>
  <text class="tiny" x="1112" y="774" text-anchor="middle">persistent graph</text>
  <path class="line memory" d="M268 752 H314"/>
  <path class="line memory" d="M413 716 C410 660 394 636 394 610"/>
  <path class="line graph" d="M748 752 H794"/>
  <path class="line graph" d="M988 752 H1034"/>
  <path class="line graph" d="M653 716 C655 660 656 610 656 366"/>
  <path class="line memory" d="M173 716 C174 620 300 200 334 196"/>

  <rect x="38" y="858" width="1204" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <path class="line data" d="M70 872 H116"/>
  <text class="tiny" x="126" y="876">data/control</text>
  <path class="line graph" d="M232 872 H278"/>
  <text class="tiny" x="288" y="876">graph query/write</text>
  <path class="line memory" d="M438 872 H484"/>
  <text class="tiny" x="494" y="876">memory retrieval/injection</text>
  <path class="line safety" d="M700 872 H746"/>
  <text class="tiny" x="756" y="876">safety interception</text>
  <path class="line action" d="M910 872 H956"/>
  <text class="tiny" x="966" y="876">device action</text>
</svg>
