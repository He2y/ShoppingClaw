<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopping-Agent architecture overview</title>
  <desc id="desc">Layered architecture showing VLM planner, runtime graph controller, memory system, graph store, and device backends.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .bandLabel { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; rx: 14; }
      .vlm { fill: #e0f2fe; stroke: #0284c7; }
      .runtime { fill: #ecfeff; stroke: #0891b2; }
      .memory { fill: #f0fdf4; stroke: #16a34a; }
      .graph { fill: #fefce8; stroke: #ca8a04; }
      .device { fill: #f1f5f9; stroke: #64748b; }
      .safety { fill: #fff1f2; stroke: #e11d48; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.7; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowLight); }
      .thin { stroke: #94a3b8; stroke-width: 1.3; fill: none; marker-end: url(#arrowLight); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="60" y="54">Shopping-Agent: VLM-Primary Agent with Active Mobile Spatial Graph</text>
  <text class="subtitle" x="60" y="82">The VLM makes semantic decisions; AMSG provides reusable navigation, localization, verification, and memory-backed context.</text>

  <rect class="layer" x="45" y="120" width="1310" height="125"/>
  <text class="bandLabel" x="70" y="152">Task and Semantic Reasoning</text>
  <rect class="vlm" x="290" y="145" width="210" height="72" rx="10"/>
  <text class="boxTitle" x="315" y="174">Task Planner</text>
  <text class="boxText" x="315" y="196">VLM pre-plan and slots</text>
  <rect class="vlm" x="590" y="145" width="250" height="72" rx="10"/>
  <text class="boxTitle" x="615" y="174">Vision-Language Model</text>
  <text class="boxText" x="615" y="196">semantic choice and grounding</text>
  <rect class="safety" x="930" y="145" width="245" height="72" rx="10"/>
  <text class="boxTitle" x="955" y="174">Safety Guards</text>
  <text class="boxText" x="955" y="196">SpecGuard, verification, HITL</text>

  <rect class="layer" x="45" y="280" width="1310" height="160"/>
  <text class="bandLabel" x="70" y="312">Runtime Graph Guidance</text>
  <rect class="runtime" x="210" y="325" width="230" height="82" rx="10"/>
  <text class="boxTitle" x="235" y="354">Page Classifier</text>
  <text class="boxText" x="235" y="376">page type, summary, elements</text>
  <rect class="runtime" x="510" y="325" width="260" height="82" rx="10"/>
  <text class="boxTitle" x="535" y="354">GraphRuntimeController</text>
  <text class="boxText" x="535" y="376">belief, route, RuntimeDAG</text>
  <rect class="runtime" x="850" y="325" width="235" height="82" rx="10"/>
  <text class="boxTitle" x="875" y="354">ActionAdvisor</text>
  <text class="boxText" x="875" y="376">promoted hints, fast path</text>
  <rect class="runtime" x="1145" y="325" width="160" height="82" rx="10"/>
  <text class="boxTitle" x="1170" y="354">Repair</text>
  <text class="boxText" x="1170" y="376">rollback or replan</text>

  <rect class="layer" x="45" y="475" width="1310" height="145"/>
  <text class="bandLabel" x="70" y="507">Memory and AMSG Knowledge</text>
  <rect class="memory" x="150" y="530" width="220" height="62" rx="10"/>
  <text class="boxTitle" x="175" y="558">FAISS MemoryStore</text>
  <text class="boxText" x="175" y="580">preferences and task history</text>
  <rect class="memory" x="430" y="530" width="230" height="62" rx="10"/>
  <text class="boxTitle" x="455" y="558">UnifiedSessionState</text>
  <text class="boxText" x="455" y="580">progress, constraints, products</text>
  <rect class="graph" x="720" y="525" width="245" height="72" rx="10"/>
  <text class="boxTitle" x="745" y="554">SpatialGraphMemory</text>
  <text class="boxText" x="745" y="576">PageState, TransitionEdge</text>
  <rect class="graph" x="1030" y="525" width="235" height="72" rx="10"/>
  <text class="boxTitle" x="1055" y="554">Neo4j AMSG Store</text>
  <text class="boxText" x="1055" y="576">UIState, Action, Functionality</text>

  <rect class="layer" x="45" y="655" width="1310" height="145"/>
  <text class="bandLabel" x="70" y="687">Execution and Learning Loop</text>
  <rect class="device" x="180" y="710" width="220" height="62" rx="10"/>
  <text class="boxTitle" x="205" y="738">Device Backends</text>
  <text class="boxText" x="205" y="760">ADB, HDC, XCTest</text>
  <rect class="device" x="480" y="710" width="220" height="62" rx="10"/>
  <text class="boxTitle" x="505" y="738">Action Handler</text>
  <text class="boxText" x="505" y="760">Tap, Type, Swipe, Back</text>
  <rect class="graph" x="780" y="710" width="230" height="62" rx="10"/>
  <text class="boxTitle" x="805" y="738">Edge Lifecycle</text>
  <text class="boxText" x="805" y="760">hypothesis to promoted</text>
  <rect class="graph" x="1080" y="710" width="210" height="62" rx="10"/>
  <text class="boxTitle" x="1105" y="738">Graph Builder</text>
  <text class="boxText" x="1105" y="760">online and offline import</text>

  <path class="line" d="M500 181 H590"/>
  <path class="line" d="M840 181 H930"/>
  <path class="line" d="M715 217 V325"/>
  <path class="line" d="M440 366 H510"/>
  <path class="line" d="M770 366 H850"/>
  <path class="line" d="M1085 366 H1145"/>
  <path class="line" d="M895 407 V525"/>
  <path class="line" d="M965 561 H1030"/>
  <path class="line" d="M1147 597 V710"/>
  <path class="line" d="M700 741 H780"/>
  <path class="line" d="M1010 741 H1080"/>
  <path class="dash" d="M590 181 C510 230 390 250 325 325"/>
  <path class="dash" d="M850 365 C780 440 710 490 660 530"/>
  <path class="dash" d="M780 710 C700 650 640 620 545 592"/>
  <path class="dash" d="M1185 710 C1240 620 1260 500 1225 407"/>
  <path class="thin" d="M400 741 H480"/>
  <path class="thin" d="M290 710 C250 600 250 470 300 407"/>

  <text class="small" x="72" y="845">Invariant: high-risk or semantically underdetermined transitions are routed to VLM or human takeover; only verified grounded transitions may bypass VLM.</text>
</svg>
