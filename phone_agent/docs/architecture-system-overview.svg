<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ca8a04"/></marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1060" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="530" y="30" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">ClawGUI-Agent v4.1 — Core Module Relationships</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ROW 1: User → ClarificationAgent → PhoneAgent      -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- User -->
  <circle cx="80" cy="90" r="26" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="86" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">User</text>
  <text x="80" y="100" text-anchor="middle" fill="#64748b" font-size="9">Task</text>

  <!-- → -->
  <line x1="106" y1="90" x2="164" y2="90" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="135" y="82" text-anchor="middle" fill="#2563eb" font-size="9" font-weight="600">task</text>

  <!-- ClarificationAgent -->
  <rect x="168" y="62" width="220" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#sh)"/>
  <text x="278" y="84" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="700">ClarificationAgent</text>
  <text x="278" y="100" text-anchor="middle" fill="#9a3412" font-size="9">规则 → Memory偏好 → VLM (三层短路)</text>

  <!-- → -->
  <line x1="388" y1="90" x2="454" y2="90" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="421" y="82" text-anchor="middle" fill="#2563eb" font-size="9" font-weight="600">clarified task</text>

  <!-- PhoneAgent -->
  <rect x="458" y="58" width="200" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" filter="url(#sh)"/>
  <rect x="462" y="62" width="192" height="56" rx="10" fill="none" stroke="#93c5fd" stroke-width="0.7"/>
  <text x="558" y="84" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">PhoneAgent</text>
  <text x="558" y="102" text-anchor="middle" fill="#3b82f6" font-size="9">截图→推理→动作 主循环编排</text>

  <!-- TaskSpecExtractor (shared, below ClarificationAgent) -->
  <rect x="168" y="138" width="148" height="42" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#sh)"/>
  <text x="242" y="156" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="700">TaskSpecExtractor</text>
  <text x="242" y="170" text-anchor="middle" fill="#a16207" font-size="9">统一槽位提取</text>

  <!-- ClarificationAgent ↔ TaskSpecExtractor -->
  <line x1="278" y1="118" x2="254" y2="134" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="256" y="128" fill="#a16207" font-size="8" font-weight="600">extract</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ROW 2: Perception → Planning → Routing             -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- PageClassifier -->
  <rect x="80" y="226" width="160" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="248" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">PageClassifier</text>
  <text x="160" y="262" text-anchor="middle" fill="#64748b" font-size="9">VLM 页面语义分类</text>

  <!-- SpatialGraphMemory -->
  <rect x="290" y="226" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="390" y="248" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">SpatialGraphMemory</text>
  <text x="390" y="262" text-anchor="middle" fill="#047857" font-size="9">locate() → plan() → RoutePlan</text>

  <!-- RuntimeController -->
  <rect x="540" y="226" width="190" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
  <text x="635" y="248" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">RuntimeController</text>
  <text x="635" y="262" text-anchor="middle" fill="#64748b" font-size="9">Navigate / Explore / Verify</text>

  <!-- PhoneAgent → PageClassifier -->
  <path d="M 500,122 L 500,190 L 200,190 L 160,222" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="340" y="186" text-anchor="middle" fill="#2563eb" font-size="9" font-weight="600">screenshot</text>

  <!-- PageClassifier → SpatialGraphMemory -->
  <line x1="240" y1="251" x2="286" y2="251" stroke="#334155" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="263" y="243" text-anchor="middle" fill="#64748b" font-size="8">page_type</text>

  <!-- SpatialGraphMemory → RuntimeController -->
  <line x1="490" y1="251" x2="536" y2="251" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="513" y="243" text-anchor="middle" fill="#059669" font-size="8">belief + plan</text>

  <!-- TaskSpecExtractor → SpatialGraphMemory (GoalSpec slots) -->
  <path d="M 316,159 Q 400,159 400,222" stroke="#ca8a04" stroke-width="1.3" fill="none" marker-end="url(#ay)"/>
  <text x="370" y="190" text-anchor="middle" fill="#a16207" font-size="8" font-weight="600">slot_dict</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ROW 3: Three execution modes + SpecGuard            -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Navigate -->
  <rect x="80" y="326" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="165" y="348" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Navigate</text>
  <text x="165" y="362" text-anchor="middle" fill="#047857" font-size="9">图谱直接执行 · 跳过 VLM</text>

  <!-- Explore -->
  <rect x="290" y="326" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="390" y="348" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">Explore (VLM)</text>
  <text x="390" y="362" text-anchor="middle" fill="#3b82f6" font-size="9">Adapter → Model → parse → 执行</text>

  <!-- Verify -->
  <rect x="540" y="326" width="190" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="635" y="348" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">Verify</text>
  <text x="635" y="362" text-anchor="middle" fill="#b91c1c" font-size="9">VLM + SpecGuard (高风险页面)</text>

  <!-- RuntimeController → 3 modes -->
  <path d="M 580,276 L 580,296 L 165,296 L 165,322" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="370" y="290" text-anchor="middle" fill="#059669" font-size="9" font-weight="600">conf ≥ 0.7 · normal risk</text>

  <line x1="635" y1="276" x2="635" y2="322" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="650" y="300" fill="#2563eb" font-size="9" font-weight="600">explore</text>

  <path d="M 690,276 L 690,296 L 850,296 L 850,270 L 730,270 L 690,296" stroke="none" fill="none"/>
  <path d="M 700,276 L 700,296 L 635,296 L 635,322" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <!-- Verify shares the same box but triggered by high risk - use the Explore arrow for position, add label -->
  <path d="M 690,276 L 730,296 L 730,322" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="754" y="300" fill="#dc2626" font-size="9" font-weight="600">risk=high</text>

  <!-- SpecGuard -->
  <rect x="790" y="326" width="150" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="865" y="348" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">SpecGuard</text>
  <text x="865" y="362" text-anchor="middle" fill="#b91c1c" font-size="9">提交前 SKU 校验</text>

  <!-- SpecGuard ← TaskSpecExtractor -->
  <path d="M 242,180 L 242,200 L 865,200 L 865,322" stroke="#ca8a04" stroke-width="1.3" fill="none" marker-end="url(#ay)"/>
  <text x="554" y="194" text-anchor="middle" fill="#a16207" font-size="8" font-weight="600">spec_dict</text>

  <!-- SpecGuard → Verify (intercept action) -->
  <path d="M 790,351 L 740,351" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="765" y="345" text-anchor="middle" fill="#dc2626" font-size="8">intercept</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ROW 4: Device + Staging                             -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- DeviceFactory -->
  <rect x="290" y="426" width="200" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#sh)"/>
  <text x="390" y="448" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">DeviceFactory</text>
  <text x="390" y="462" text-anchor="middle" fill="#64748b" font-size="9">ADB · HDC · XCTest (三平台)</text>

  <!-- All modes → Device -->
  <path d="M 165,376 L 165,396 L 340,422" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <path d="M 390,376 L 390,422" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <path d="M 635,376 L 635,396 L 440,422" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <text x="500" y="410" text-anchor="middle" fill="#ea580c" font-size="9" font-weight="600">execute action</text>

  <!-- Staging Cache -->
  <rect x="570" y="426" width="200" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="444" text-anchor="middle" fill="#065f46" font-size="11" font-weight="700">Local Staging Cache</text>
  <text x="670" y="460" text-anchor="middle" fill="#047857" font-size="9">record_observation(persist=false)</text>

  <!-- Explore → Staging -->
  <path d="M 490,360 L 530,360 L 530,420 L 580,436" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <text x="545" y="392" fill="#059669" font-size="8" font-weight="600">stage</text>

  <!-- Device → screenshot loop back -->
  <path d="M 290,451 L 50,451 L 50,90 L 54,90" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#ab)" stroke-dasharray="6,3"/>
  <text x="38" y="270" fill="#2563eb" font-size="9" font-weight="600" transform="rotate(-90,38,270)">screenshot loop</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ROW 5: Memory + Graph Storage                       -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- MemoryStore -->
  <rect x="80" y="530" width="190" height="60" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="175" y="554" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="700">MemoryStore</text>
  <text x="175" y="570" text-anchor="middle" fill="#7c3aed" font-size="9">FAISS 2048d · 用户偏好/联系人</text>
  <text x="175" y="582" text-anchor="middle" fill="#7c3aed" font-size="8">按需检索 (RetrievalGateway)</text>

  <!-- Neo4j -->
  <rect x="310" y="530" width="190" height="60" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="405" y="554" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Neo4j (AMSG)</text>
  <text x="405" y="570" text-anchor="middle" fill="#047857" font-size="9">UIState → Action → UIState</text>
  <text x="405" y="582" text-anchor="middle" fill="#047857" font-size="8">门控写入 · promotable only</text>

  <!-- UnifiedSessionState -->
  <rect x="540" y="530" width="200" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="640" y="554" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="700">UnifiedSessionState</text>
  <text x="640" y="570" text-anchor="middle" fill="#9a3412" font-size="9">商品 · 步骤 · 约束 · 进度</text>
  <text x="640" y="582" text-anchor="middle" fill="#9a3412" font-size="8">每轮注入轻量级摘要</text>

  <!-- StatusReporter -->
  <rect x="790" y="530" width="150" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="865" y="554" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">StatusReporter</text>
  <text x="865" y="570" text-anchor="middle" fill="#64748b" font-size="9">记忆/图谱/澄清/守卫</text>
  <text x="865" y="582" text-anchor="middle" fill="#64748b" font-size="8">CLI + webui 可观测</text>

  <!-- Staging → Neo4j (gated) -->
  <path d="M 670,476 L 670,496 L 460,520 L 440,526" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <rect x="510" y="494" width="136" height="16" rx="3" fill="#ecfdf5" stroke="none"/>
  <text x="578" y="506" text-anchor="middle" fill="#059669" font-size="9" font-weight="700">flush_staged_graph</text>
  <text x="578" y="518" text-anchor="middle" fill="#059669" font-size="8">canonicalize → promote</text>

  <!-- MemoryStore → ClarificationAgent (preferences) -->
  <path d="M 120,530 L 120,500 L 80,500 L 80,160 L 164,160" stroke="#9333ea" stroke-width="1.3" fill="none" marker-end="url(#ap)" stroke-dasharray="6,3"/>
  <text x="68" y="340" fill="#9333ea" font-size="8" font-weight="600" transform="rotate(-90,68,340)">user preferences</text>

  <!-- Memory → PhoneAgent (context injection) -->
  <path d="M 175,530 L 175,510 L 558,510 L 558,490 L 558,122" stroke="#9333ea" stroke-width="1.3" fill="none" marker-end="url(#ap)" stroke-dasharray="6,3"/>
  <text x="368" y="504" text-anchor="middle" fill="#9333ea" font-size="9" font-weight="600">context injection</text>

  <!-- Neo4j → SpatialGraphMemory (graph query) -->
  <path d="M 405,530 L 405,510 L 390,280" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#ag)" stroke-dasharray="6,3"/>
  <text x="412" y="400" fill="#059669" font-size="8" font-weight="600" transform="rotate(-90,412,400)">graph query</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- LEGEND                                               -->
  <!-- ════════════════════════════════════════════════════ -->

  <rect x="40" y="618" width="980" height="90" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Arrow legend -->
  <text x="60" y="638" fill="#111827" font-size="11" font-weight="700">Arrow Legend</text>
  <line x1="60" y1="656" x2="92" y2="656" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="100" y="660" fill="#64748b" font-size="10">数据流</text>
  <line x1="160" y1="656" x2="192" y2="656" stroke="#059669" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="200" y="660" fill="#64748b" font-size="10">图谱 (门控写入)</text>
  <line x1="310" y1="656" x2="342" y2="656" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ap)"/>
  <text x="350" y="660" fill="#64748b" font-size="10">记忆读取/注入</text>
  <line x1="470" y1="656" x2="502" y2="656" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="510" y="660" fill="#64748b" font-size="10">安全拦截</text>
  <line x1="590" y1="656" x2="622" y2="656" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="630" y="660" fill="#64748b" font-size="10">动作执行</text>
  <line x1="710" y1="656" x2="742" y2="656" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="750" y="660" fill="#64748b" font-size="10">共享提取</text>

  <!-- Shape legend -->
  <text x="60" y="688" fill="#111827" font-size="11" font-weight="700">Module Legend</text>
  <rect x="160" y="676" width="40" height="18" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="208" y="690" fill="#64748b" font-size="10">编排器</text>
  <rect x="270" y="676" width="40" height="18" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="318" y="690" fill="#64748b" font-size="10">共享基础设施</text>
  <rect x="420" y="676" width="40" height="18" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="468" y="690" fill="#64748b" font-size="10">图谱相关</text>
  <rect x="540" y="676" width="40" height="18" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="588" y="690" fill="#64748b" font-size="10">安全守卫</text>
  <rect x="650" y="676" width="40" height="18" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="698" y="690" fill="#64748b" font-size="10">可选/观测</text>
</svg>