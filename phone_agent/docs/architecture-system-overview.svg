<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">Mobile-ShoppingAgent v4.1 System Architecture</text>
  <text x="600" y="56" text-anchor="middle" fill="#6b7280" font-size="12">Unified Core + Quality-Gated Spatial Graph + Dual-Layer Shopping Safety</text>

  <!-- ═══ Layer 1: Entry ═══ -->
  <rect x="40" y="72" width="1120" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="88" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.06em">ENTRY LAYER</text>
  <rect x="120" y="96" width="130" height="42" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="185" y="121" text-anchor="middle" fill="#111827" font-size="12" font-weight="600">main.py (CLI)</text>
  <rect x="290" y="96" width="130" height="42" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="290" y="96" width="130" height="16" rx="8" fill="#f3f4f6"/><rect x="290" y="106" width="130" height="6" fill="#f3f4f6"/>
  <circle cx="302" cy="104" r="3" fill="#ef4444" opacity="0.7"/><circle cx="311" cy="104" r="3" fill="#f59e0b" opacity="0.7"/><circle cx="320" cy="104" r="3" fill="#10b981" opacity="0.7"/>
  <text x="355" y="130" text-anchor="middle" fill="#111827" font-size="12" font-weight="600">webui.py</text>
  <rect x="460" y="96" width="130" height="42" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="121" text-anchor="middle" fill="#111827" font-size="12" font-weight="600">nanobot (Chat)</text>

  <!-- ═══ Layer 2: Agent Orchestrator ═══ -->
  <rect x="40" y="164" width="1120" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="180" fill="#2563eb" font-size="10" font-weight="600" letter-spacing="0.06em">AGENT ORCHESTRATOR</text>
  <rect x="80" y="192" width="260" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="83" y="195" width="254" height="44" rx="8" fill="none" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="210" y="214" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">PhoneAgent</text>
  <text x="210" y="232" text-anchor="middle" fill="#3b82f6" font-size="10">截图→推理→动作 主循环 (Android/HarmonyOS)</text>
  <rect x="360" y="192" width="160" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="214" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">IOSPhoneAgent</text>
  <text x="440" y="232" text-anchor="middle" fill="#3b82f6" font-size="10">iOS XCTest</text>
  <rect x="540" y="192" width="200" height="50" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="640" y="214" text-anchor="middle" fill="#c2410c" font-size="13" font-weight="600">ClarificationAgent</text>
  <text x="640" y="232" text-anchor="middle" fill="#9a3412" font-size="10">三层短路: 规则→Memory→VLM</text>

  <!-- ═══ Layer 3: Core Infrastructure (NEW) ═══ -->
  <rect x="40" y="270" width="1120" height="82" rx="10" fill="url(#coreGrad)" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="286" fill="#dc2626" font-size="10" font-weight="700" letter-spacing="0.06em">CORE INFRASTRUCTURE (v4.1 新增)</text>
  <rect x="80" y="296" width="300" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="314" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">TaskSpecExtractor</text>
  <text x="230" y="330" text-anchor="middle" fill="#b91c1c" font-size="10">统一槽位提取 (color/storage/size/query/contact/app)</text>
  <rect x="400" y="296" width="220" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="314" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">SpecGuard</text>
  <text x="510" y="330" text-anchor="middle" fill="#b91c1c" font-size="10">购物安全守卫 (提交前规格校验)</text>
  <rect x="640" y="296" width="200" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="314" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">StatusReporter</text>
  <text x="740" y="330" text-anchor="middle" fill="#b91c1c" font-size="10">可观测性事件分发</text>
  <!-- Dependency arrows within core -->
  <path d="M 380,317 L 400,317" stroke="#dc2626" stroke-width="1" marker-end="url(#arrow-orange)" opacity="0.5"/>

  <!-- ═══ Layer 4: Core Subsystems ═══ -->
  <rect x="40" y="366" width="1120" height="260" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="382" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.06em">CORE SUBSYSTEMS</text>

  <!-- Model Layer -->
  <rect x="60" y="394" width="250" height="216" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="76" y="410" fill="#7c3aed" font-size="10" font-weight="600">MODEL LAYER</text>
  <rect x="80" y="420" width="106" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="133" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">ModelClient</text>
  <text x="133" y="450" text-anchor="middle" fill="#6b7280" font-size="9">OpenAI 兼容</text>
  <rect x="194" y="420" width="106" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="247" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">ProtocolBridge</text>
  <text x="247" y="450" text-anchor="middle" fill="#6b7280" font-size="9">坐标归一化</text>
  <rect x="80" y="466" width="220" height="30" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="190" y="485" text-anchor="middle" fill="#5b21b6" font-size="10" font-weight="600">5× VLM Adapters</text>
  <rect x="80" y="502" width="66" height="22" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="113" y="516" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600">AutoGLM</text>
  <rect x="150" y="502" width="56" height="22" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="178" y="516" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600">UI-TARS</text>
  <rect x="210" y="502" width="58" height="22" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="239" y="516" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600">Qwen-VL</text>
  <rect x="112" y="528" width="54" height="22" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="139" y="542" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600">MAI-UI</text>
  <rect x="170" y="528" width="66" height="22" rx="4" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="203" y="542" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600">GUI-Owl</text>
  <rect x="80" y="558" width="220" height="26" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="190" y="575" text-anchor="middle" fill="#6b7280" font-size="10">Prompt Templates × 5 × 2 语言</text>

  <!-- Action Layer -->
  <rect x="330" y="394" width="170" height="216" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="346" y="410" fill="#ea580c" font-size="10" font-weight="600">ACTION LAYER</text>
  <rect x="350" y="420" width="130" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="415" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">ActionHandler</text>
  <text x="415" y="450" text-anchor="middle" fill="#6b7280" font-size="9">解析 + 执行</text>
  <rect x="350" y="466" width="130" height="30" rx="6" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="415" y="485" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="600">5× Handlers</text>
  <rect x="350" y="504" width="130" height="30" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="415" y="523" text-anchor="middle" fill="#6b7280" font-size="10">DeviceActionIR</text>

  <!-- Memory + Spatial Layer -->
  <rect x="520" y="394" width="620" height="216" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="536" y="410" fill="#16a34a" font-size="10" font-weight="600">MEMORY + SPATIAL LAYER</text>

  <rect x="540" y="420" width="140" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">MemoryManager</text>
  <text x="610" y="450" text-anchor="middle" fill="#6b7280" font-size="9">总协调 + 门控写入</text>
  <rect x="540" y="466" width="140" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="484" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">MemoryStore (FAISS)</text>
  <rect x="540" y="500" width="140" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="518" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">UnifiedSessionState</text>
  <rect x="540" y="534" width="140" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="610" y="552" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">RetrievalGateway</text>

  <rect x="700" y="420" width="160" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="780" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">SpatialGraphMemory</text>
  <text x="780" y="450" text-anchor="middle" fill="#6b7280" font-size="9">定位 + 路径 + 暂存</text>
  <rect x="700" y="466" width="160" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="780" y="484" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600">RuntimeController v4</text>
  <rect x="700" y="500" width="160" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="780" y="518" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600">SpatialModelBridge</text>
  <rect x="700" y="534" width="160" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="780" y="552" text-anchor="middle" fill="#b91c1c" font-size="10" font-weight="600">flush_staged_graph()</text>

  <rect x="880" y="420" width="240" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1000" y="436" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">PageClassifier + SchemaRegistry</text>
  <text x="1000" y="450" text-anchor="middle" fill="#6b7280" font-size="9">VLM 页面分类 + YAML 领域先验</text>
  <rect x="880" y="466" width="240" height="28" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1000" y="484" text-anchor="middle" fill="#6b7280" font-size="10">FunctionalityDiscovery (promotable only)</text>
  <rect x="880" y="500" width="240" height="28" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="1000" y="518" text-anchor="middle" fill="#6b7280" font-size="10">PostconditionVerifier</text>

  <!-- ═══ Layer 5: Device ═══ -->
  <rect x="40" y="642" width="460" height="86" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="658" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.06em">DEVICE LAYER</text>
  <rect x="60" y="668" width="110" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="688" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">DeviceFactory</text>
  <text x="115" y="702" text-anchor="middle" fill="#6b7280" font-size="9">平台抽象</text>
  <rect x="185" y="670" width="90" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="230" y="688" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">ADB</text>
  <text x="230" y="700" text-anchor="middle" fill="#6b7280" font-size="9">Android</text>
  <rect x="285" y="670" width="90" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="330" y="688" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">HDC</text>
  <text x="330" y="700" text-anchor="middle" fill="#6b7280" font-size="9">HarmonyOS</text>
  <rect x="385" y="670" width="90" height="38" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="430" y="688" text-anchor="middle" fill="#111827" font-size="11" font-weight="600">XCTest</text>
  <text x="430" y="700" text-anchor="middle" fill="#6b7280" font-size="9">iOS (WDA)</text>

  <!-- ═══ Layer 6: Storage ═══ -->
  <rect x="520" y="642" width="640" height="86" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="536" y="658" fill="#6b7280" font-size="10" font-weight="600" letter-spacing="0.06em">STORAGE LAYER</text>
  <!-- Neo4j -->
  <ellipse cx="610" cy="678" rx="44" ry="11" fill="#dbeafe" stroke="#008CC1" stroke-width="1.5"/>
  <rect x="566" y="678" width="88" height="32" fill="#dbeafe" stroke="none"/>
  <line x1="566" y1="678" x2="566" y2="710" stroke="#008CC1" stroke-width="1.5"/>
  <line x1="654" y1="678" x2="654" y2="710" stroke="#008CC1" stroke-width="1.5"/>
  <ellipse cx="610" cy="710" rx="44" ry="11" fill="#93c5fd" stroke="#008CC1" stroke-width="1.5"/>
  <text x="610" y="698" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700">Neo4j</text>
  <text x="610" y="726" text-anchor="middle" fill="#6b7280" font-size="9">空间图谱 (门控写入)</text>
  <!-- FAISS -->
  <ellipse cx="760" cy="678" rx="44" ry="11" fill="#ede9fe" stroke="#0467DF" stroke-width="1.5"/>
  <rect x="716" y="678" width="88" height="32" fill="#ede9fe" stroke="none"/>
  <line x1="716" y1="678" x2="716" y2="710" stroke="#0467DF" stroke-width="1.5"/>
  <line x1="804" y1="678" x2="804" y2="710" stroke="#0467DF" stroke-width="1.5"/>
  <ellipse cx="760" cy="710" rx="44" ry="11" fill="#c4b5fd" stroke="#0467DF" stroke-width="1.5"/>
  <text x="760" y="698" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="700">FAISS</text>
  <text x="760" y="726" text-anchor="middle" fill="#6b7280" font-size="9">向量索引</text>
  <!-- JSON/NumPy -->
  <path d="M 870,668 L 940,668 L 952,680 L 952,718 L 870,718 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <path d="M 940,668 L 940,680 L 952,680" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="911" y="694" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="600">JSON / NumPy</text>
  <text x="911" y="726" text-anchor="middle" fill="#6b7280" font-size="9">本地持久化</text>

  <!-- ═══ Legend ═══ -->
  <rect x="40" y="748" width="1120" height="200" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="770" fill="#111827" font-size="13" font-weight="700">v4.1 Architecture Highlights</text>

  <rect x="60" y="784" width="340" height="150" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="76" y="802" fill="#dc2626" font-size="11" font-weight="700">Core 基础设施层 (新增)</text>
  <text x="76" y="820" fill="#374151" font-size="10">TaskSpecExtractor: 4 模块共享的统一槽位提取</text>
  <text x="76" y="836" fill="#374151" font-size="10">SpecGuard: 从 agent.py 独立，显式传参</text>
  <text x="76" y="852" fill="#374151" font-size="10">StatusReporter: 记忆/图谱/澄清状态可见</text>
  <text x="76" y="876" fill="#6b7280" font-size="10">消费者: ClarificationAgent, SpecGuard,</text>
  <text x="76" y="892" fill="#6b7280" font-size="10">GoalSpec, MemoryManager</text>
  <text x="76" y="916" fill="#9a3412" font-size="10" font-weight="600">依赖方向: 无外部依赖 ← 叶子层</text>

  <rect x="420" y="784" width="340" height="150" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="436" y="802" fill="#16a34a" font-size="11" font-weight="700">图谱写入门控 (修复)</text>
  <text x="436" y="820" fill="#374151" font-size="10">在线执行: persist=False → 本地暂存</text>
  <text x="436" y="836" fill="#374151" font-size="10">任务成功: flush_staged_graph()</text>
  <text x="436" y="852" fill="#374151" font-size="10">  → canonicalize (去重合并)</text>
  <text x="436" y="868" fill="#374151" font-size="10">  → promote (质量过滤)</text>
  <text x="436" y="884" fill="#374151" font-size="10">  → Neo4j 写入</text>
  <text x="436" y="908" fill="#374151" font-size="10">任务失败: 不写入 (避免坏转换污染)</text>
  <text x="436" y="924" fill="#15803d" font-size="10" font-weight="600">FunctionalityItem: 仅 promotable 入库</text>

  <rect x="780" y="784" width="360" height="150" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="796" y="802" fill="#ea580c" font-size="11" font-weight="700">双层购物安全 (强化)</text>
  <text x="796" y="824" fill="#374151" font-size="10" font-weight="600">Layer 1: ClarificationAgent (任务前)</text>
  <text x="796" y="840" fill="#374151" font-size="10">规则预过滤 → Memory偏好填充 → VLM兜底</text>
  <text x="796" y="856" fill="#374151" font-size="10">非购物任务: 0ms 跳过 (不调 VLM)</text>
  <text x="796" y="880" fill="#374151" font-size="10" font-weight="600">Layer 2: SpecGuard (提交前)</text>
  <text x="796" y="896" fill="#374151" font-size="10">共享 TaskSpecExtractor 提取规格</text>
  <text x="796" y="912" fill="#374151" font-size="10">校验 SKU 匹配 → 放行 / Interact 拦截</text>
  <text x="796" y="930" fill="#9a3412" font-size="10" font-weight="600">两者互补: 意图补全 + 安全兜底</text>
</svg>