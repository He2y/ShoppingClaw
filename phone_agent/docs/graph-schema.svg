<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">AMSG graph schema</title>
  <desc id="desc">Neo4j schema for UIState, Action, FunctionalityItem, FunctionalityCluster, and TaskTarget nodes.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .nodeTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .field { font: 400 12.5px Arial, sans-serif; fill: #334155; }
      .rel { font: 700 12px Arial, sans-serif; fill: #334155; }
      .ui { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; }
      .action { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; }
      .fn { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.4; }
      .cluster { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .task { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; }
      .life { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text class="title" x="55" y="54">Active Mobile Spatial Graph Schema</text>
  <text class="subtitle" x="55" y="80">The core transition motif is UIState -> Action -> UIState; functionality and lifecycle metadata make the graph reusable and self-maintaining.</text>

  <rect class="ui" x="85" y="190" width="280" height="245" rx="14"/>
  <text class="nodeTitle" x="115" y="225">UIState</text>
  <text class="field" x="115" y="255">state_id</text>
  <text class="field" x="115" y="278">app, page_type</text>
  <text class="field" x="115" y="301">summary</text>
  <text class="field" x="115" y="324">landmarks[]</text>
  <text class="field" x="115" y="347">affordances[]</text>
  <text class="field" x="115" y="370">slots JSON</text>
  <text class="field" x="115" y="393">risk_level</text>
  <text class="field" x="115" y="416">semantic_signature</text>

  <rect class="action" x="610" y="155" width="300" height="315" rx="14"/>
  <text class="nodeTitle" x="640" y="190">Action</text>
  <text class="field" x="640" y="220">action_id</text>
  <text class="field" x="640" y="243">type, intent</text>
  <text class="field" x="640" y="266">semantic_target</text>
  <text class="field" x="640" y="289">target_locator JSON</text>
  <text class="field" x="640" y="312">region</text>
  <text class="field" x="640" y="335">expected_postcondition</text>
  <text class="field" x="640" y="358">summary, reasoning</text>
  <text class="field" x="640" y="381">confidence, risk_level</text>
  <text class="field" x="640" y="404">lifecycle fields</text>
  <text class="field" x="640" y="427">outcome distribution</text>

  <rect class="ui" x="1145" y="190" width="280" height="245" rx="14"/>
  <text class="nodeTitle" x="1175" y="225">UIState</text>
  <text class="field" x="1175" y="255">target page state</text>
  <text class="field" x="1175" y="278">same abstraction fields</text>
  <text class="field" x="1175" y="301">postcondition evidence</text>
  <text class="field" x="1175" y="324">incoming transition stats</text>

  <path class="line" d="M365 312 H610"/>
  <text class="rel" x="455" y="292">NEXT_ACTION</text>
  <path class="line" d="M910 312 H1145"/>
  <text class="rel" x="1006" y="292">PRODUCES</text>

  <rect class="life" x="620" y="540" width="280" height="165" rx="14"/>
  <text class="nodeTitle" x="650" y="575">Lifecycle Metadata</text>
  <text class="field" x="650" y="605">stage: hypothesis/candidate</text>
  <text class="field" x="650" y="628">promoted/demoted</text>
  <text class="field" x="650" y="651">verification_count</text>
  <text class="field" x="650" y="674">dominance_ratio</text>
  <text class="field" x="650" y="697">outcome_entropy</text>
  <path class="dash" d="M760 470 V540"/>
  <text class="rel" x="778" y="512">stored on Action</text>

  <rect class="fn" x="85" y="555" width="305" height="190" rx="14"/>
  <text class="nodeTitle" x="115" y="590">FunctionalityItem</text>
  <text class="field" x="115" y="620">functionality_id</text>
  <text class="field" x="115" y="643">type: functionality or data</text>
  <text class="field" x="115" y="666">canonical_role</text>
  <text class="field" x="115" y="689">bbox, region</text>
  <text class="field" x="115" y="712">observed_postcondition</text>
  <path class="line" d="M235 555 V435"/>
  <text class="rel" x="250" y="505">EXPOSES_FUNCTION</text>

  <rect class="cluster" x="1095" y="555" width="330" height="190" rx="14"/>
  <text class="nodeTitle" x="1125" y="590">FunctionalityCluster</text>
  <text class="field" x="1125" y="620">cluster_id</text>
  <text class="field" x="1125" y="643">canonical_name</text>
  <text class="field" x="1125" y="666">member ids, apps, page_types</text>
  <text class="field" x="1125" y="689">verified_edges</text>
  <text class="field" x="1125" y="712">success_count, risk_level</text>
  <path class="line" d="M390 650 H1095"/>
  <text class="rel" x="692" y="630">MEMBER_OF</text>
  <path class="dash" d="M1095 690 C1005 745 860 750 795 705"/>
  <text class="rel" x="930" y="744">IMPLEMENTS_FUNCTION</text>
  <path class="dash" d="M1260 555 V435"/>
  <text class="rel" x="1278" y="505">LEADS_TO</text>

  <rect class="task" x="590" y="765" width="340" height="90" rx="14"/>
  <text class="nodeTitle" x="620" y="800">TaskTarget</text>
  <text class="field" x="620" y="830">description, app, goal_spec, success</text>
  <path class="dash" d="M590 812 C420 790 315 630 250 435"/>
  <text class="rel" x="402" y="786">STARTS_AT</text>
  <path class="dash" d="M930 812 C1110 790 1240 630 1285 435"/>
  <text class="rel" x="1078" y="786">ENDS_AT</text>
</svg>
